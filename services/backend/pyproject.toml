[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-app"
version = "0.1.0"
description = "Ezcmty backend"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.14,<2.0",
  "argon2-cffi>=23.1,<26.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5.2,<6.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
  "cryptography>=50.0.2,<51",
  "python-multipart>=0.0.21,<1.0",
  "openpyxl>=3.1.5,<4.0",
  "defusedxml>=0.7.1,<1.0",
]

[project.optional-dependencies]
dev = [
  "setuptools>=75,<81",
  "mypy>=1.14,<2.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.9,<1.0",
  "types-redis>=4.6,<5.0",
  "types-openpyxl>=3.1.5,<4.0",
  "types-defusedxml>=0.7.0,<1.0",
  "psutil>=7.2,<8",
  "types-psutil>=7.2,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"backend_app.import_definitions" = ["**/*.json"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "devtools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra --strict-markers --import-mode=importlib"
pythonpath = [".", "../.."]
markers = [
  "unit: isolated component behavior",
  "integration: collaboration between components or real dependencies",
  "contract: authoritative OpenAPI and runtime consistency",
  "postgresql: isolated PostgreSQL/Redis checks enabled by APP_RUN_POSTGRESQL_TESTS=1",
  "slow: process lifecycle checks",
]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "devtools", "../../scripts"]
