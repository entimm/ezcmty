events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  upstream platform_admin_api { server platform-admin-api:8001; }
  upstream property_admin_api { server property-admin-api:8002; }
  upstream resident_api { server resident-api:8003; }
  upstream webhook { server webhook:8004; }

  server {
    listen 80;

    location /api/platform-admin/ {
      proxy_pass http://platform_admin_api/;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/property-admin/ {
      proxy_pass http://property_admin_api/;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/resident/ {
      proxy_pass http://resident_api/;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /webhooks/ {
      proxy_pass http://webhook/;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }
}
