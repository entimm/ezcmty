---
openapi: 3.1.0
info:
  title: Community Property Platform API
  version: 0.15.0
  description: 社区物业消费返利与物业费抵扣平台 API 契约。
servers:
  - url: '/'
tags:
  - name: system
    description: 运行状态接口
  - name: admin
    description: 后台认证、账号、角色与审计
  - name: property
    description: 物业公司、小区与公司管理员接入管理
  - name: housing
    description: 小区空间、房屋和业主资料管理
  - name: billing
    description: 物业费计费依据、账单、收款流水与线下登记
  - name: miniapp
    description: 平台小程序身份与居民业务
  - name: payments
    description: 居民账单缴费与支付渠道通知
  - name: payment-management
    description: 收款配置、支付资金记录、核对与恢复
  - name: imports
    description: 管理后台通用批量导入
