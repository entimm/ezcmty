companyActiveMerchantBinding:
  put:
    operationId: replaceCompanyActiveMerchantBinding
    x-runtimes:
      - platform_admin_api
    tags:
      - payment-management
    summary: 切换或停用公司收款商户
    description:
      渠道接入、平台接收关系和比例上限在锁外核验；公司锁内重新比较 expected_configuration_token 后原子切换并递增受影响绑定 row_version。无规则可激活，ready=false 且 reasons 包含 rule_missing。目标商户自身接入、接收关系及上限必须核验成功；若旧规则超过新上限，允许激活但 ready=false 且 reasons 包含 ratio_exceeded，所有新支付被阻止，发布兼容规则后才可收款。只影响后续创建订单，历史支付使用原配置。令牌过期返回
      409 payment.configuration_changed，不承诺旧响应重放；响应未知先 GET 核实，不自动更新期望后重试。 所有请求校验完整管理会话、当前权限和资源范围；越界返回 404。 写入要求可信 Origin 和当前会话
      CSRF；不自动换键重试。
    security:
      - AdminSession: []
    x-permissions:
      - platform.payment_config.manage
    parameters:
      - name: company_id
        in: path
        required: true
        schema:
          $ref: ../components/schemas.yaml#/UUIDIdentifier
      - name: Origin
        in: header
        required: true
        schema:
          type: string
          maxLength: 2048
        description: 必须为受信后台 Origin；缺失或不可信拒绝。
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          maxLength: 256
        description: 必须匹配当前完整管理会话。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/payment-management-schemas.yaml#/ActiveMerchantBindingUpdate
    responses:
      '200':
        description: 操作成功。
        headers:
          X-Request-ID:
            $ref: ../components/headers.yaml#/RequestId
          Cache-Control:
            schema:
              type: string
              const: no-store
            description: 敏感管理数据禁止缓存。
        content:
          application/json:
            schema:
              $ref: ../components/payment-management-schemas.yaml#/PaymentConfiguration
      '401':
        $ref: ../components/responses.yaml#/AdminProblem
      '403':
        $ref: ../components/responses.yaml#/AdminProblem
      '404':
        $ref: ../components/responses.yaml#/AdminProblem
      '409':
        $ref: ../components/responses.yaml#/AdminProblem
      '422':
        $ref: ../components/responses.yaml#/AdminProblem
      '500':
        $ref: ../components/responses.yaml#/AdminProblem
      '503':
        $ref: ../components/responses.yaml#/AdminProblem
