          maxLength: 2048
        description: 必须为受信后台 Origin；缺失或不可信拒绝。
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          maxLength: 256
        description: 必须匹配当前完整管理会话。
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
        description: 公司内持久去重；同键同规范输入返回原资源当前状态，同键异输入返回 409。响应未知须原键原输入恢复。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/payment-management-schemas.yaml#/ProfitSharingRuleCreate
    responses:
      '201':
        description: 操作成功；重放返回原资源当前状态。
