companyMerchantBindings:
  get:
    operationId: listCompanyMerchantBindings
    x-runtimes:
      - platform_admin_api
    tags:
      - payment-management
    summary: 查询公司商户绑定历史
    description: 包含当前有效绑定和停用历史；分页按 created_at,id 稳定排序。 所有请求校验完整管理会话、当前权限和资源范围；越界返回 404。GET 只读本地事实，可安全重试。
    security:
      - AdminSession: []
    x-permissions:
      - platform.payment_config.read
    parameters:
      - name: company_id
        in: path
        required: true
        schema:
          $ref: ../components/schemas.yaml#/UUIDIdentifier
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
            - created_at,id
            - -created_at,-id
          default: -created_at,-id
      - name: enabled
        in: query
        required: false
        schema:
          type: boolean
    responses:
      '200':
        description: 操作成功。
        headers:
          X-Request-ID:
            $ref: ../components/headers.yaml#/RequestId
          Cache-Control:
            schema:
              type: string
              const: no-store
            description: 敏感管理数据禁止缓存。
        content:
          application/json:
            schema:
              $ref: ../components/payment-management-schemas.yaml#/MerchantBindingPage
      '401':
        $ref: ../components/responses.yaml#/AdminProblem
      '403':
        $ref: ../components/responses.yaml#/AdminProblem
      '404':
        $ref: ../components/responses.yaml#/AdminProblem
      '409':
        $ref: ../components/responses.yaml#/AdminProblem
      '422':
        $ref: ../components/responses.yaml#/AdminProblem
      '500':
        $ref: ../components/responses.yaml#/AdminProblem
      '503':
        $ref: ../components/responses.yaml#/AdminProblem
  post:
    operationId: createCompanyMerchantBinding
    x-runtimes:
      - platform_admin_api
    tags:
      - payment-management
    summary: 创建停用商户绑定
    description:
      服务商号来自受控配置；先校验幂等重放，再比较配置令牌。首次成功默认 enabled=false；重放不能重新激活历史绑定。创建不等于已验证商户主体，线下核验仍必需。payment.configuration_changed
      与 payment.idempotency_conflict 返回 409。 所有请求校验完整管理会话、当前权限和资源范围；越界返回 404。 写入要求可信 Origin 和当前会话 CSRF；不自动换键重试。
    security:
      - AdminSession: []
    x-permissions:
      - platform.payment_config.manage
    parameters:
      - name: company_id
        in: path
        required: true
        schema:
          $ref: ../components/schemas.yaml#/UUIDIdentifier
      - name: Origin
        in: header
        required: true
        schema:
          type: string
          maxLength: 2048
        description: 必须为受信后台 Origin；缺失或不可信拒绝。
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          maxLength: 256
        description: 必须匹配当前完整管理会话。
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
        description: 公司内持久去重；同键同规范输入返回原资源当前状态，同键异输入返回 409。响应未知须原键原输入恢复。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/payment-management-schemas.yaml#/MerchantBindingCreate
    responses:
      '201':
        description: 操作成功；重放返回原资源当前状态。
        headers:
          X-Request-ID:
            $ref: ../components/headers.yaml#/RequestId
          Cache-Control:
            schema:
              type: string
              const: no-store
            description: 敏感管理数据禁止缓存。
        content:
          application/json:
            schema:
              $ref: ../components/payment-management-schemas.yaml#/MerchantBinding
      '401':
        $ref: ../components/responses.yaml#/AdminProblem
      '403':
        $ref: ../components/responses.yaml#/AdminProblem
      '404':
        $ref: ../components/responses.yaml#/AdminProblem
      '409':
        $ref: ../components/responses.yaml#/AdminProblem
      '422':
        $ref: ../components/responses.yaml#/AdminProblem
      '500':
        $ref: ../components/responses.yaml#/AdminProblem
      '503':
        $ref: ../components/responses.yaml#/AdminProblem
