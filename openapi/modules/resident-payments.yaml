houseBills:
  get:
    operationId: listResidentHouseBills
    x-runtimes: &residentRuntimes
      - client_api
    tags: &residentTags
      - payments
    summary: 查询当前授权房屋的历史账单
    description: >-
      要求 ClientToken 与 X-Client-Identity=resident，从当前微信用户派生居民身份，不查询 resident 关联；本人有效额外身份类型不适用返回403 client.identity_mismatch，额外身份不可用返回403 client.identity_unavailable，未知或他人关联返回404，缺少或格式错误返回422。
      校验当前居民账号、公司、房屋完整路径及房屋绑定均有效，越界返回404。
      不限制认领前账期；默认查询仍有欠款的有效账单，scope=all 查询全部历史账单。
      返回脱敏视图；GET只读取本地事实，不下单、关单或签发支付参数。
    security: &residentSecurity
      - ClientToken: []
    parameters:
      - $ref: ../components/client-parameters.yaml#/ClientIdentity
      - name: binding_id
        in: path
        required: true
        schema:
          $ref: ../components/schemas.yaml#/UUIDIdentifier
      - name: scope
        in: query
        required: false
        schema:
          type: string
          enum:
            - outstanding
            - all
          default: outstanding
      - name: billing_month_from
        in: query
        required: false
        description: 包含该月份，与 billing_month_to 共同提供时不得晚于结束月份。
        schema:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
      - name: billing_month_to
        in: query
        required: false
        description: 包含该月份，默认不限制认领前账期。
        schema:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
      - name: page
        in: query
        required: false
        schema: &pageSchema
          type: integer
          minimum: 1
          maximum: 9007199254740991
          default: 1
      - name: page_size
        in: query
        required: false
        schema: &pageSizeSchema
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
            - -billing_month,-id
            - billing_month,id
          default: -billing_month,-id
    responses:
      '200':
        description: 同一查询快照内的账单分页结果。
        headers: &privateResponseHeaders
          X-Request-ID:
            $ref: ../components/headers.yaml#/RequestId
          Cache-Control:
            description: 居民支付与账务响应禁止缓存。
            schema:
              type: string
              const: no-store
        content:
          application/json:
            schema:
              $ref: ../components/resident-payment-schemas.yaml#/ResidentBillPage
      '401':
        $ref: ../components/responses.yaml#/ClientUnauthorized
      '403': &residentProblem
        $ref: ../components/responses.yaml#/ClientProblem
      '404': *residentProblem
      '422': *residentProblem
      '429': &residentRateLimit
        description: 操作过于频繁，按 Retry-After 延后请求。
        headers:
          X-Request-ID:
            $ref: ../components/headers.yaml#/RequestId
          Cache-Control:
            schema:
              type: string
              const: no-store
          Retry-After:
            schema:
              type: integer
              minimum: 1
        content:
          application/problem+json:
            schema:
              $ref: ../components/errors.yaml#/ProblemDetails
      '500': *residentProblem
      '503': *residentProblem
bill:
  get:
    operationId: getResidentBill
    x-runtimes: *residentRuntimes
    tags: *residentTags
    summary: 查看当前授权房屋账单
    description: >-
      要求 ClientToken 与 X-Client-Identity=resident，从当前微信用户派生居民身份，不查询 resident 关联；本人有效额外身份类型不适用返回403 client.identity_mismatch，额外身份不可用返回403 client.identity_unavailable，未知或他人关联返回404，缺少或格式错误返回422。
      要求当前有效房屋授权，允许查看认领前账单。本人历史支付关系不能替代房屋当前授权。
      其他居民占用仅显示通用处理中提示；只在占用属于本人时返回本人原订单ID。
      GET只读取本地事实；派生的可支付提示不替代创建支付时的锁内校验。
    security: *residentSecurity
    parameters:
      - $ref: ../components/client-parameters.yaml#/ClientIdentity
      - name: bill_id
        in: path
        required: true
        schema:
          $ref: ../components/schemas.yaml#/UUIDIdentifier
    responses:
      '200':
        description: 脱敏账单详情。
        headers: *privateResponseHeaders
        content:
          application/json:
            schema:
              $ref: ../components/resident-payment-schemas.yaml#/ResidentBill
      '401':
        $ref: ../components/responses.yaml#/ClientUnauthorized
      '403': *residentProblem
      '404': *residentProblem
      '422': *residentProblem
      '429': *residentRateLimit
      '500': *residentProblem
      '503': *residentProblem
entries:
  get:
    operationId: listResidentBillSettlementEntries
    x-runtimes: *residentRuntimes
    tags: *residentTags
    summary: 查询房屋历史收款流水
    description: >-
      要求 ClientToken 与 X-Client-Identity=resident，从当前微信用户派生居民身份，不查询 resident 关联；本人有效额外身份类型不适用返回403 client.identity_mismatch，额外身份不可用返回403 client.identity_unavailable，未知或他人关联返回404，缺少或格式错误返回422。
      要求当前有效房屋授权，认领前流水同样可见。仅返回日期、金额、来源及调整标识；
      不公开他人的付款身份、渠道单号、凭证及管理员自由文本。
      仅本人的线上流水返回 own_payment_order_id。线下冲正展示为线下登记调整，不表示退款。
    security: *residentSecurity
    parameters:
      - $ref: ../components/client-parameters.yaml#/ClientIdentity
      - name: bill_id
        in: path
        required: true
        schema:
          $ref: ../components/schemas.yaml#/UUIDIdentifier
      - name: page
        in: query
        required: false
        schema: *pageSchema
      - name: page_size
        in: query
        required: false
        schema: *pageSizeSchema
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
            - -created_at,-id
            - created_at,id
          default: -created_at,-id
    responses:
      '200':
        description: 同一查询快照内的脱敏收款流水分页结果。
        headers: *privateResponseHeaders
        content:
          application/json:
            schema:
              $ref: ../components/resident-payment-schemas.yaml#/ResidentBillSettlementEntryPage
      '401':
        $ref: ../components/responses.yaml#/ClientUnauthorized
      '403': *residentProblem
      '404': *residentProblem
      '422': *residentProblem
      '429': *residentRateLimit
      '500': *residentProblem
      '503': *residentProblem
orders:
  get:
    operationId: listResidentPaymentOrders
    x-runtimes: *residentRuntimes
    tags: *residentTags
    summary: 查询本人缴费订单
    description: >-
      要求 ClientToken 与 X-Client-Identity=resident，从当前微信用户派生居民身份，不查询 resident 关联；本人有效额外身份类型不适用返回403 client.identity_mismatch，额外身份不可用返回403 client.identity_unavailable，未知或他人关联返回404，缺少或格式错误返回422。
      仅按付款人关系返回本人订单；解绑后仍可查询本人历史订单及所付账单摘要，
      但不能据此读取房屋最新余额和他人流水。idempotency_key 精确筛选用于恢复丢失响应；
      空结果仅表示当前未查到已提交订单，不能据此更换幂等键重付。GET不发起渠道请求。
    security: *residentSecurity
    parameters:
      - $ref: ../components/client-parameters.yaml#/ClientIdentity
      - name: status
        in: query
        required: false
        schema:
          $ref: ../components/resident-payment-schemas.yaml#/ResidentPaymentStatus
      - name: confirmation_status
        in: query
        required: false
        schema:
          $ref: ../components/resident-payment-schemas.yaml#/ResidentPaymentConfirmationStatus
      - name: idempotency_key
        in: query
        required: false
        description: 仅在当前付款人范围内精确匹配，不能读取或推断他人的订单。
        schema: &idempotencyKeySchema
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]{1,128}$
      - name: created_at_from
        in: query
        required: false
        description: 包含该时间，必须带时区；与结束时间共同提供时不得晚于结束时间。
        schema:
          type: string
          format: date-time
      - name: created_at_to
        in: query
        required: false
        description: 不包含该时间，必须带时区；允许的时区偏移输入转换为UTC。
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        required: false
        schema: *pageSchema
      - name: page_size
        in: query
        required: false
        schema: *pageSizeSchema
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
            - -created_at,-id
            - created_at,id
          default: -created_at,-id
    responses:
      '200':
        description: 同一查询快照内的本人订单分页结果。
        headers: *privateResponseHeaders
        content:
          application/json:
            schema:
              $ref: ../components/resident-payment-schemas.yaml#/ResidentPaymentOrderPage
      '401':
        $ref: ../components/responses.yaml#/ClientUnauthorized
      '403': *residentProblem
      '404': *residentProblem
      '422': *residentProblem
      '429': *residentRateLimit
      '500': *residentProblem
      '503': *residentProblem
  post:
    operationId: createResidentPaymentOrder
    x-runtimes: *residentRuntimes
    tags: *residentTags
    summary: 创建单张账单付清订单
    description: >-
      要求 ClientToken 与 X-Client-Identity=resident，从当前微信用户派生居民身份，不查询 resident 关联；本人有效额外身份类型不适用返回403 client.identity_mismatch，额外身份不可用返回403 client.identity_unavailable，未知或他人关联返回404，缺少或格式错误返回422。
      先完成当前居民认证，并在本人范围匹配幂等原单；同键同输入重放不要求当前房屋授权。
      仅新建订单要求当前有效房屋授权。按既有锁顺序锁账单后，核对 expected_row_version、剩余欠款、
      支付占用及收款配置，同事务持久创建订单、明细、占用和可靠任务后返回201。
      本期恰好一张账单，金额为全部剩余欠款；商户、付款人、规则及服务费由服务端确定。
      Idempotency-Key 在当前付款人范围去重：同键同输入返回原订单当前状态，重放仍201，
      原订单关闭后旧键仍返回原关闭订单；同键不同输入409。
      同键重放按本人订单关系返回原资源，不重建订单，也不因后来解绑而隐藏本人原订单。
      不同键遇本人占用可返回本人原订单ID；他人占用仅返回通用冲突，不暴露他人订单。
      201不承诺渠道已下单或收款。超时、503及空查询结果均不能作为换键重付依据。
    security: *residentSecurity
    parameters:
      - $ref: ../components/client-parameters.yaml#/ClientIdentity
      - name: Idempotency-Key
        in: header
        required: true
        schema: *idempotencyKeySchema
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/resident-payment-schemas.yaml#/ResidentPaymentOrderCreate
    responses:
      '201':
        description: 本地订单及恢复任务已提交，或同键同输入重放返回原订单当前状态。
        headers: *privateResponseHeaders
        content:
          application/json:
            schema:
              $ref: ../components/resident-payment-schemas.yaml#/ResidentPaymentOrder
      '401':
        $ref: ../components/responses.yaml#/ClientUnauthorized
      '403': *residentProblem
      '404': *residentProblem
      '409':
        $ref: ../components/responses.yaml#/ClientProblem
        description: >-
          payment.idempotency_conflict：同键不同输入；payment.bill_reserved：账单已被支付占用；
          payment.bill_version_conflict：账单版本变化；payment.bill_not_payable：账单不可支付；
          payment.configuration_unavailable：收款配置不可用；
          payment.rate_exceeds_channel_limit：试算应分金额超过渠道限制。
      '422': *residentProblem
      '429': *residentRateLimit
      '500': *residentProblem
      '503': *residentProblem
order:
  get:
    operationId: getResidentPaymentOrder
    x-runtimes: *residentRuntimes
    tags: *residentTags
    summary: 查看本人缴费订单
    description: >-
      要求 ClientToken 与 X-Client-Identity=resident，从当前微信用户派生居民身份，不查询 resident 关联；本人有效额外身份类型不适用返回403 client.identity_mismatch，额外身份不可用返回403 client.identity_unavailable，未知或他人关联返回404，缺少或格式错误返回422。
      仅付款人本人可读，越界返回404；解绑后仍返回本人历史付款及账单摘要。
      awaiting_posting 仅来源于已完成身份、商户、AppID、订单、金额和成功状态核验的可信收款证据；
      此时显示已收款确认中，不允许重复支付。仅 succeeded/posted 可显示缴费成功。
      分账、解冻或对账未完成不改变居民缴费成功。GET不发起渠道请求。
    security: *residentSecurity
    parameters:
      - $ref: ../components/client-parameters.yaml#/ClientIdentity
      - name: payment_order_id
        in: path
        required: true
        schema:
          $ref: ../components/schemas.yaml#/UUIDIdentifier
    responses:
      '200':
        description: 本人订单当前状态及可用操作。
        headers: *privateResponseHeaders
        content:
          application/json:
            schema:
              $ref: ../components/resident-payment-schemas.yaml#/ResidentPaymentOrder
      '401':
        $ref: ../components/responses.yaml#/ClientUnauthorized
      '403': *residentProblem
      '404': *residentProblem
      '422': *residentProblem
      '429': *residentRateLimit
      '500': *residentProblem
      '503': *residentProblem
parameters:
  post:
    operationId: createResidentClientPaymentParameters
    x-runtimes: *residentRuntimes
    tags: *residentTags
    summary: 取得原订单客户端调起参数
    description: >-
      要求 ClientToken 与 X-Client-Identity=resident，从当前微信用户派生居民身份，不查询 resident 关联；本人有效额外身份类型不适用返回403 client.identity_mismatch，额外身份不可用返回403 client.identity_unavailable，未知或他人关联返回404，缺少或格式错误返回422。
      同时要求本人订单关系与当前有效房屋授权，且原订单允许继续支付；否则409或越界404。
      使用原金额、原商户、原规则及原预支付凭证签发参数，不创建新订单，不接受客户端覆盖支付字段。
      pending、unknown、closing、已到期、可信收款待入账和终态订单均不得签发。
      尚未取得可用预支付凭证时返回409，客户端读取原订单或请求刷新，不另建支付。
      参数仅交当前付款人，响应Cache-Control为no-store，禁止写入日志、分析事件及客户端持久存储。
      此操作无需新的幂等键；重复签发仍属于同一订单。已签发凭证不能承诺在撤权时即时失效。
    security: *residentSecurity
    parameters:
      - $ref: ../components/client-parameters.yaml#/ClientIdentity
      - name: payment_order_id
        in: path
        required: true
        schema:
          $ref: ../components/schemas.yaml#/UUIDIdentifier
    responses:
      '200':
        description: 原订单的小程序调起参数；客户端结果不能替代后端支付确认。
        headers: *privateResponseHeaders
        content:
          application/json:
            schema:
              $ref: ../components/resident-payment-schemas.yaml#/ResidentClientPaymentParameters
      '401':
        $ref: ../components/responses.yaml#/ClientUnauthorized
      '403': *residentProblem
      '404': *residentProblem
      '409':
        $ref: ../components/responses.yaml#/ClientProblem
        description: >-
          payment.parameters_unavailable：原订单尚无有效调起参数；
          payment.order_not_payable：原订单当前不允许继续支付，包括可信收款待入账、到期、关闭中或终态。
      '422': *residentProblem
      '429': *residentRateLimit
      '500': *residentProblem
      '503': *residentProblem
refreshes:
  post:
    operationId: createResidentPaymentRefresh
    x-runtimes: *residentRuntimes
    tags: *residentTags
    summary: 请求核实原支付结果
    description: >-
      要求 ClientToken 与 X-Client-Identity=resident，从当前微信用户派生居民身份，不查询 resident 关联；本人有效额外身份类型不适用返回403 client.identity_mismatch，额外身份不可用返回403 client.identity_unavailable，未知或他人关联返回404，缺少或格式错误返回422。
      仅付款人本人可请求，解绑后仍可核实本人订单。
      非终态按原订单合并持久查单任务后返回202，已有可靠任务则复用，不为每次点击新建资金业务。
      已终态返回200当前订单。无需新的幂等键，禁止将客户端成功或取消标记作为收款或关单依据。
      202不承诺已经完成渠道查询；查询结果和通知共用可信、幂等入账入口。
    security: *residentSecurity
    parameters:
      - $ref: ../components/client-parameters.yaml#/ClientIdentity
      - name: payment_order_id
        in: path
        required: true
        schema:
          $ref: ../components/schemas.yaml#/UUIDIdentifier
    responses:
      '200':
        description: 原订单已终态，返回当前结果。
        headers: *privateResponseHeaders
        content:
          application/json:
            schema:
              $ref: ../components/resident-payment-schemas.yaml#/ResidentPaymentOrder
      '202':
        description: 原订单的可靠核实任务已提交或复用，返回当前本地订单供继续查询。
        headers: *privateResponseHeaders
        content:
          application/json:
            schema:
              $ref: ../components/resident-payment-schemas.yaml#/ResidentPaymentOrder
      '401':
        $ref: ../components/responses.yaml#/ClientUnauthorized
      '403': *residentProblem
      '404': *residentProblem
      '422': *residentProblem
      '429': *residentRateLimit
      '500': *residentProblem
      '503': *residentProblem
closures:
  post:
    operationId: createResidentPaymentClosure
    x-runtimes: *residentRuntimes
    tags: *residentTags
    summary: 请求关闭本人原支付订单
    description: >-
      要求 ClientToken 与 X-Client-Identity=resident，从当前微信用户派生居民身份，不查询 resident 关联；本人有效额外身份类型不适用返回403 client.identity_mismatch，额外身份不可用返回403 client.identity_unavailable，未知或他人关联返回404，缺少或格式错误返回422。
      仅付款人本人可请求，解绑后仍可关闭本人未支付订单。
      按原订单合并可靠查询及关单任务，非终态返回202；关闭前先核实原单，确认关闭后才释放占用。
      本地到期、未支付、客户端取消或请求超时都不能直接释放占用。
      关闭途中若已成功收款则继续入账；已终态返回200当前订单，包括成功订单，不执行退款。
      awaiting_posting 仅安排确认与入账恢复，不向渠道关闭已确认收款。
      无需新的幂等键，不为重复点击创建新的支付或资金业务。
    security: *residentSecurity
    parameters:
      - $ref: ../components/client-parameters.yaml#/ClientIdentity
      - name: payment_order_id
        in: path
        required: true
        schema:
          $ref: ../components/schemas.yaml#/UUIDIdentifier
    responses:
      '200':
        description: 原订单已成功或已关闭，返回当前终态；不表示退款。
        headers: *privateResponseHeaders
        content:
          application/json:
            schema:
              $ref: ../components/resident-payment-schemas.yaml#/ResidentPaymentOrder
      '202':
        description: 原订单关闭或结果核实任务已可靠提交或复用，返回当前订单。
        headers: *privateResponseHeaders
        content:
          application/json:
            schema:
              $ref: ../components/resident-payment-schemas.yaml#/ResidentPaymentOrder
      '401':
        $ref: ../components/responses.yaml#/ClientUnauthorized
      '403': *residentProblem
      '404': *residentProblem
      '422': *residentProblem
      '429': *residentRateLimit
      '500': *residentProblem
      '503': *residentProblem
