sessions:
  post:
    operationId: createClientSession
    x-runtimes:
      - client_api
    tags:
      - miniapp
    summary: 统一微信登录并创建客户端会话
    description: 微信 code 仅用于解析平台微信用户。成功签发新的随机不透明 ClientToken，会话不保存当前选中身份或角色权限。居民身份从有效微信用户派生，不创建、补建或回填 resident 关联；其他已撤销关联不会因登录被恢复。身份目录另行只读查询。登录无 Idempotency-Key；结果未知时重新取得微信 code，不自动重放一次性 code。
    security: []
    responses:
      '401': &id002
        $ref: ../components/responses.yaml#/ClientUnauthorized
      '403': &id003
        $ref: ../components/responses.yaml#/ClientProblem
      '404': &id004
        $ref: ../components/responses.yaml#/ClientProblem
      '409': &id005
        $ref: ../components/responses.yaml#/ClientProblem
      '422': &id006
        $ref: ../components/responses.yaml#/ClientProblem
      '500': &id007
        $ref: ../components/responses.yaml#/ClientProblem
      '503': &id008
        $ref: ../components/responses.yaml#/ClientProblem
      '429': &id009
        description: 操作过于频繁
        headers:
          X-Request-ID: &id001
            $ref: ../components/headers.yaml#/RequestId
          Cache-Control:
            schema:
              type: string
              const: no-store
          Retry-After:
            schema:
              type: integer
              minimum: 1
        content:
          application/problem+json:
            schema:
              $ref: ../components/errors.yaml#/ProblemDetails
      '201':
        description: 操作成功
        headers: &id010
          X-Request-ID: *id001
          Cache-Control:
            schema:
              type: string
              const: no-store
        content:
          application/json:
            schema:
              $ref: ../components/miniapp-schemas.yaml#/ClientSession
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/miniapp-schemas.yaml#/MiniappLogin
currentSession:
  get:
    operationId: getClientSession
    x-runtimes:
      - client_api
    tags:
      - miniapp
    summary: 恢复客户端会话
    description: 统一客户端会话授权访问本人公共资源，不要求 X-Client-Identity；敏感响应不缓存。
    security:
      - ClientToken: []
    responses:
      '401': *id002
      '403': *id003
      '404': *id004
      '409': *id005
      '422': *id006
      '500': *id007
      '503': *id008
      '429': *id009
      '200':
        description: 操作成功
        headers: *id010
        content:
          application/json:
            schema:
              $ref: ../components/miniapp-schemas.yaml#/ClientSessionState
  delete:
    operationId: deleteClientSession
    x-runtimes:
      - client_api
    tags:
      - miniapp
    summary: 退出当前客户端会话
    description: 统一客户端会话授权访问本人公共资源，不要求 X-Client-Identity；敏感响应不缓存。
    security:
      - ClientToken: []
    responses:
      '401': *id002
      '403': *id003
      '404': *id004
      '409': *id005
      '422': *id006
      '500': *id007
      '503': *id008
      '429': *id009
      '204':
        description: 操作成功
        headers: *id010
