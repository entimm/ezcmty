phones:
  get:
    operationId: listPhoneBindings
    x-runtimes:
      - client_api
    tags:
      - miniapp
    summary: 查询本人手机号
    description: 统一客户端会话授权访问本人公共资源，不要求 X-Client-Identity；敏感响应不缓存。
    security:
      - ClientToken: []
    responses:
      '401': *id002
      '403': *id003
      '404': *id004
      '409': *id005
      '422': *id006
      '500': *id007
      '503': *id008
      '429': *id009
      '200':
        description: 操作成功
        headers: *id010
        content:
          application/json:
            schema:
              $ref: ../components/miniapp-schemas.yaml#/PhoneBindingPage
    parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
  post:
    operationId: createPhoneBinding
    x-runtimes:
      - client_api
    tags:
      - miniapp
    summary: 微信快速验证并绑定手机号
    description: 微信快速验证成功后直接保存绑定与成功记录；多号码可复用。Idempotency-Key同键同输入返回当前绑定，包括已解绑状态；同键不同输入409。手填号码须与微信结果一致。新建与重放均201。Redis不保存临时手机号凭证或结果。
    security:
      - ClientToken: []
    responses:
      '401': *id002
      '403': *id003
      '404': *id004
      '409': *id005
      '422': *id006
      '500': *id007
      '503': *id008
      '429': *id009
      '201':
        description: 操作成功
        headers: *id010
        content:
          application/json:
            schema:
              $ref: ../components/miniapp-schemas.yaml#/PhoneBinding
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/miniapp-schemas.yaml#/PhoneBindingCreate
    parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]{1,128}$
