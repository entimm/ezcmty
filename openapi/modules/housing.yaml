houses:
  get:
    operationId: listHouses
    x-runtimes:
      - property_admin_api
    x-permissions:
      - property.house.read
    tags:
      - housing
    summary: 查询小区房屋
    description: 要求物业完整会话及声明权限，公司和路径资源由服务端限定，越界返回404。读取可安全重试。
    security:
      - AdminSession: []
    parameters:
      - name: community_id
        in: path
        required: true
        schema:
          $ref: ../components/schemas.yaml#/UUIDIdentifier
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: space_node_id
        in: query
        required: false
        schema:
          anyOf:
            - $ref: ../components/schemas.yaml#/UUIDIdentifier
            - type: 'null'
      - name: room_no
        in: query
        required: false
        schema:
          anyOf:
            - type: string
              maxLength: 32
            - type: 'null'
      - name: external_code
        in: query
        required: false
        schema:
          anyOf:
            - type: string
              maxLength: 64
            - type: 'null'
      - name: floor_no
        in: query
        required: false
        schema:
          anyOf:
            - type: integer
              minimum: -32768
              maximum: 32767
            - type: 'null'
      - name: enabled
        in: query
        required: false
        schema:
          anyOf:
            - type: boolean
            - type: 'null'
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
            - created_at
            - -created_at
          default: -created_at
    responses:
      '200':
        description: 操作成功
        headers:
          X-Request-ID:
            $ref: ../components/headers.yaml#/RequestId
        content:
