spaceNodes:
  get:
    operationId: listSpaceNodes
    x-runtimes:
      - property_admin_api
    x-permissions:
      - property.space.read
    tags:
      - housing
    summary: 查询空间子节点
    description: 要求物业完整会话及声明权限，公司和路径资源由服务端限定，越界返回404。读取可安全重试。
    security:
      - AdminSession: []
    parameters:
      - name: community_id
        in: path
        required: true
        schema:
          $ref: ../components/schemas.yaml#/UUIDIdentifier
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: parent_id
        in: query
        required: false
        schema:
          anyOf:
            - $ref: ../components/schemas.yaml#/UUIDIdentifier
            - type: 'null'
    responses:
      '200':
        description: 操作成功
        headers:
          X-Request-ID:
            $ref: ../components/headers.yaml#/RequestId
        content:
          application/json:
            schema:
              $ref: ../components/housing-schemas.yaml#/SpaceNodePage
      '401':
        $ref: ../components/responses.yaml#/AdminProblem
      '403':
        $ref: ../components/responses.yaml#/AdminProblem
      '404':
        $ref: ../components/responses.yaml#/AdminProblem
      '409':
        $ref: ../components/responses.yaml#/AdminProblem
      '422':
        $ref: ../components/responses.yaml#/AdminProblem
      '500':
        $ref: ../components/responses.yaml#/AdminProblem
      '503':
        $ref: ../components/responses.yaml#/AdminProblem
  post:
