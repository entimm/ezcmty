communities:
  get:
    operationId: listClaimableCommunities
    x-runtimes:
      - resident_api
    tags:
      - miniapp
    summary: 查找可认领小区
    description: 按本人或当前物业公司限定资源；状态/版本变化返回409。分页按创建时间及ID稳定排序。仅待审核允许撤回或审批。批准时申请、房屋绑定和审计同事务提交。
    security:
      - ResidentToken: []
    responses:
      '401': &id002
        $ref: ../components/responses.yaml#/AdminProblem
      '403': &id003
        $ref: ../components/responses.yaml#/AdminProblem
      '404': &id004
        $ref: ../components/responses.yaml#/AdminProblem
      '409': &id005
        $ref: ../components/responses.yaml#/AdminProblem
      '422': &id006
        $ref: ../components/responses.yaml#/AdminProblem
      '500': &id007
        $ref: ../components/responses.yaml#/AdminProblem
      '503': &id008
        $ref: ../components/responses.yaml#/AdminProblem
      '429': &id009
        description: 操作过于频繁
        headers:
          X-Request-ID: &id001
            $ref: ../components/headers.yaml#/RequestId
          Retry-After:
            schema:
              type: integer
              minimum: 1
        content:
          application/problem+json:
            schema:
              $ref: ../components/errors.yaml#/ProblemDetails
      '200':
        description: 操作成功
        headers: &id010
          X-Request-ID: *id001
        content:
          application/json:
            schema:
              $ref: ../components/house-claim-schemas.yaml#/ClaimableCommunityPage
    parameters:
      - name: name
        in: query
        required: false
        schema:
          anyOf:
            - type: string
              maxLength: 160
            - type: 'null'
      - &id011
        name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - &id012
        name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
