            - -created_at
          default: -created_at
  post:
    operationId: createHouseClaim
    x-runtimes:
      - resident_api
    tags:
      - miniapp
    summary: 提交房屋认领
    description:
      按本人或当前物业公司限定资源；状态/版本变化返回409。分页按创建时间及ID稳定排序。仅待审核允许撤回或审批。批准时申请、房屋绑定和审计同事务提交。
      创建首次201，同键同输入重放返回原记录当前状态200；同键不同输入409。
    security:
      - ResidentToken: []
    responses:
      '401': *id002
      '403': *id003
      '404': *id004
      '409': *id005
      '422': *id006
      '500': *id007
      '503': *id008
      '429': *id009
      '201':
        description: 操作成功
        headers: *id010
        content: &id014
          application/json:
            schema:
              $ref: ../components/house-claim-schemas.yaml#/ResidentHouseClaim
      '200':
        description: 操作成功
        headers: *id010
        content: *id014
    parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]{1,128}$
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/house-claim-schemas.yaml#/HouseClaimCreate
