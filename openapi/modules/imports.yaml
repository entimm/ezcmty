template:
  get:
    operationId: getImportTemplate
    x-runtimes:
      - platform_admin_api
      - property_admin_api
    x-permissions-by-runtime:
      platform_admin_api:
        - platform.import.create
      property_admin_api:
        - property.import.create
    tags:
      - imports
    summary: 读取固定模板版本
    description: 版本为正整数，配置摘要为小写64hex；停止新建的历史版本仍按权限读取，缺失版本404，固定配置漂移409。 所有请求复核当前后台、公司与范围；不可见资源404，已可见资源缺少操作权限403。导入权限必须叠加实际业务权限，不能扩张后台业务能力。
    security:
      - AdminSession: []
    parameters:
      - $ref: ../components/import-parameters.yaml#/TypeKey
      - $ref: ../components/import-parameters.yaml#/VersionNo
    responses:
      '200':
        description: 操作成功。
        headers:
          X-Request-ID:
            $ref: ../components/headers.yaml#/RequestId
          Cache-Control:
            description: 敏感导入数据禁止缓存。
            schema:
              type: string
              const: no-store
        content:
          application/json:
            schema:
              $ref: ../components/import-schemas.yaml#/ImportTemplate
      '401':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '403':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '404':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '409':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '422':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '500':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '503':
        $ref: ../components/import-responses.yaml#/ImportProblem
templateFile:
  get:
    operationId: downloadImportTemplate
    x-runtimes:
      - platform_admin_api
      - property_admin_api
    x-permissions-by-runtime:
      platform_admin_api:
        - platform.import.create
      property_admin_api:
        - property.import.create
    tags:
      - imports
    summary: 下载固定版本模板
    description: 生成或读取固定版本CSV/XLSX模板，通过鉴权API流式下载，不跳转、不签公开短链；安全文件名和禁止缓存。 所有请求复核当前后台、公司与范围；不可见资源404，已可见资源缺少操作权限403。导入权限必须叠加实际业务权限，不能扩张后台业务能力。
    security:
      - AdminSession: []
    parameters:
      - $ref: ../components/import-parameters.yaml#/TypeKey
      - $ref: ../components/import-parameters.yaml#/VersionNo
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum:
            - csv
            - xlsx
          default: xlsx
    responses:
      '401':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '403':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '404':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '409':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '422':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '500':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '503':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '200':
        description: 受控文件流；服务端安全文件名，禁止缓存。
        headers:
          X-Request-ID:
            $ref: ../components/headers.yaml#/RequestId
          Cache-Control:
            description: 敏感导入数据禁止缓存。
            schema:
              type: string
              const: no-store
          Content-Disposition:
            description: attachment; filename=<safe ASCII>; filename*=UTF-8''<encoded safe name>，禁止路径或控制字符。
            schema:
              type: string
              minLength: 1
          Content-Length:
            description: 实际文件字节数。
            schema:
              type: integer
              minimum: 0
          X-Content-Type-Options:
            description: 禁止MIME嗅探。
            schema:
              type: string
              const: nosniff
        content:
          text/csv; charset=utf-8:
            schema:
              type: string
              format: binary
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
batches:
  post:
    operationId: createImportBatch
    x-runtimes:
      - platform_admin_api
      - property_admin_api
    x-permissions-by-runtime:
      platform_admin_api:
        - platform.import.create
      property_admin_api:
        - property.import.create
    tags:
      - imports
    summary: 创建导入草稿
    description: 平台必须显式提供property_company_id，物业禁止提供，公司从身份取得；scope仅company/community。固定配置及业务能力验证成功才创建，未上传草稿24小时失效，敏感输入保留窗口为创建后30天。创建指纹仅含创建参数。 所有请求复核当前后台、公司与范围；不可见资源404，已可见资源缺少操作权限403。导入权限必须叠加实际业务权限，不能扩张后台业务能力。
    security:
      - AdminSession: []
    parameters:
      - $ref: ../components/import-parameters.yaml#/Origin
      - $ref: ../components/import-parameters.yaml#/CsrfToken
      - $ref: ../components/import-parameters.yaml#/IdempotencyKey
    x-idempotency:
      persistent: true
      scope: property_company_id+actor_scope+actor_id+request_scope+Idempotency-Key
      replay: same-status-and-first-safe-response
      conflict: import.idempotency_conflict
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/import-schemas.yaml#/ImportBatchCreate
    responses:
      '201':
        description: 操作成功。
        headers:
          X-Request-ID:
            $ref: ../components/headers.yaml#/RequestId
          Cache-Control:
            description: 敏感导入数据禁止缓存。
            schema:
              type: string
              const: no-store
        content:
          application/json:
            schema:
              $ref: ../components/import-schemas.yaml#/ImportBatchAction
      '401':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '403':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '404':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '409':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '422':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '429':
        $ref: ../components/import-responses.yaml#/ImportRateLimited
      '500':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '503':
        $ref: ../components/import-responses.yaml#/ImportProblem
    x-draft-ttl-hours: 24
  get:
    operationId: listImportBatches
    x-runtimes:
      - platform_admin_api
      - property_admin_api
    x-permissions-by-runtime:
      platform_admin_api:
        - platform.import.read
      property_admin_api:
        - property.import.read
    tags:
      - imports
    summary: 分页查询导入历史
    description: items与total使用相同的后台、公司、资源过滤；旧批次结果不会随新批次重跑改变。 所有请求复核当前后台、公司与范围；不可见资源404，已可见资源缺少操作权限403。导入权限必须叠加实际业务权限，不能扩张后台业务能力。
    security:
      - AdminSession: []
    parameters:
      - $ref: ../components/import-parameters.yaml#/Page
      - $ref: ../components/import-parameters.yaml#/PageSize
      - name: property_company_id
        in: query
        required: false
        schema:
          $ref: ../components/schemas.yaml#/UUIDIdentifier
        description: 仅平台可用；物业提供返回422。
      - name: import_type
        in: query
        required: false
        schema:
          $ref: ../components/import-schemas.yaml#/ImportTypeKey
      - name: scope_type
        in: query
        required: false
        schema:
          $ref: ../components/import-schemas.yaml#/ImportScopeType
      - name: scope_id
        in: query
        required: false
        schema:
          $ref: ../components/schemas.yaml#/UUIDIdentifier
        description: 必须同时提供scope_type。
      - name: status
        in: query
        required: false
        schema:
          $ref: ../components/import-schemas.yaml#/ImportBatchStatus
      - name: created_by
        in: query
        required: false
        schema:
          $ref: ../components/schemas.yaml#/UUIDIdentifier
      - name: has_errors
        in: query
        required: false
        schema:
          type: boolean
      - name: created_from
        in: query
        required: false
        schema:
          type: string
          format: date-time
          description: 带时区 RFC 3339；响应为 UTC Z。
        description: 含边界，需带时区。
      - name: created_before
        in: query
        required: false
        schema:
          type: string
          format: date-time
          description: 带时区 RFC 3339；响应为 UTC Z。
        description: 不含边界，必须晚于created_from。
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
            - created_at,id
            - -created_at,-id
            - updated_at,id
            - -updated_at,-id
          default: -created_at,-id
    responses:
      '200':
        description: 操作成功。
        headers:
          X-Request-ID:
            $ref: ../components/headers.yaml#/RequestId
          Cache-Control:
            description: 敏感导入数据禁止缓存。
            schema:
              type: string
              const: no-store
        content:
          application/json:
            schema:
              $ref: ../components/import-schemas.yaml#/ImportBatchPage
      '401':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '403':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '404':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '422':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '500':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '503':
        $ref: ../components/import-responses.yaml#/ImportProblem
