      '200':
        description: 操作成功。
        headers:
          X-Request-ID:
            $ref: ../components/headers.yaml#/RequestId
          Cache-Control:
            description: 敏感导入数据禁止缓存。
            schema:
              type: string
              const: no-store
        content:
