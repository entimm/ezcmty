            schema:
              $ref: ../components/import-schemas.yaml#/ImportTypeList
      '401':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '403':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '404':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '422':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '500':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '503':
        $ref: ../components/import-responses.yaml#/ImportProblem
