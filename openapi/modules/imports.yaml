sourceFile:
  post:
    operationId: uploadImportSourceFile
    x-runtimes:
      - platform_admin_api
      - property_admin_api
    x-permissions-by-runtime:
      platform_admin_api:
        - platform.import.upload
      property_admin_api:
        - property.import.upload
    tags:
      - imports
    summary: 接收源文件并安排解析预检
    description: 只允许未过期草稿一次上传；multipart唯一字段file。CSV/XLSX最大10,485,760字节、50,000数据行、200列，实际类型/完整性/摘要由服务端核实，解压及解析资源有界，拒绝宏和外部链接。上传指纹含核实后sha256。关联私有文件元数据、请求响应和解析任务同事务登记。异步问题进入问题资源。 所有请求复核当前后台、公司与范围；不可见资源404，已可见资源缺少操作权限403。导入权限必须叠加实际业务权限，不能扩张后台业务能力。
    security:
      - AdminSession: []
    parameters:
      - $ref: ../components/import-parameters.yaml#/BatchId
      - $ref: ../components/import-parameters.yaml#/Origin
      - $ref: ../components/import-parameters.yaml#/CsrfToken
      - $ref: ../components/import-parameters.yaml#/IdempotencyKey
    x-idempotency:
      persistent: true
      scope: property_company_id+actor_scope+actor_id+request_scope+Idempotency-Key
      replay: same-status-and-first-safe-response
      conflict: import.idempotency_conflict
    responses:
      '202':
        description: 请求已成功受理；异步任务是否完成请查询资源。
        headers:
          X-Request-ID:
            $ref: ../components/headers.yaml#/RequestId
          Cache-Control:
            description: 敏感导入数据禁止缓存。
            schema:
              type: string
              const: no-store
        content:
          application/json:
            schema:
              $ref: ../components/import-schemas.yaml#/ImportBatchAction
      '401':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '403':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '404':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '409':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '410':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '413':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '415':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '422':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '429':
        $ref: ../components/import-responses.yaml#/ImportRateLimited
      '500':
        $ref: ../components/import-responses.yaml#/ImportProblem
      '503':
        $ref: ../components/import-responses.yaml#/ImportProblem
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            additionalProperties: false
            required:
              - file
            properties:
              file:
                type: string
                format: binary
                maxLength: 10485760
          encoding:
            file:
              contentType: text/csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    x-source-file-limits:
      max_bytes: 10485760
      max_rows: 50000
      max_columns: 200
