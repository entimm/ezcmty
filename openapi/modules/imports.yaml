    x-permissions-by-runtime:
      platform_admin_api:
        - platform.import.create
      property_admin_api:
        - property.import.create
    tags:
      - imports
    summary: 查询当前可用导入类型
    description: 目录不分页，仅返回当前后台支持且同时具备导入与业务创建权限的类型；无生产适配器时items=[]。 所有请求复核当前后台、公司与范围；不可见资源404，已可见资源缺少操作权限403。导入权限必须叠加实际业务权限，不能扩张后台业务能力。
