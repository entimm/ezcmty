AdminSession:
  type: apiKey
  in: cookie
  name: admin_session

ClientToken:
  type: http
  scheme: bearer
  description: 仅由 client-api 接受的统一微信用户会话；业务请求另以 X-Client-Identity 选择并验证业务身份，不共享后台 Cookie 会话。

WebhookSignature:
  type: apiKey
  in: header
  name: X-Webhook-Signature

WechatpaySignature:
  type: apiKey
  in: header
  name: Wechatpay-Signature
  description: 微信支付原始报文签名；与时间戳、随机串及可信公钥或证书标识共同验证，不是居民或管理员身份凭证。
