HouseClaimCreate:
  type: object
  additionalProperties: false
  properties:
    house_id: &id001
      $ref: ./schemas.yaml#/UUIDIdentifier
    applicant_name:
      type: string
      minLength: 1
      maxLength: 80
    phone_binding_id: *id001
    applicant_remark:
      anyOf: &id003
        - type: string
          minLength: 1
          maxLength: 1000
        - type: 'null'
  required:
    - house_id
    - applicant_name
    - phone_binding_id
ClaimCancellation:
  type: object
  additionalProperties: false
  properties:
    expected_row_version: &id002
      type: integer
      minimum: 1
      maximum: 9007199254740991
  required:
    - expected_row_version
ClaimReview:
  type: object
  additionalProperties: false
  properties:
    expected_row_version: *id002
    decision:
      type: string
      enum:
        - approved
        - rejected
    reason:
      anyOf: *id003
  required:
    - expected_row_version
    - decision
HouseRelease:
  type: object
  additionalProperties: false
  properties:
    expected_row_version: *id002
    reason:
      anyOf: *id003
  required:
    - expected_row_version
HouseRevocation:
  type: object
  additionalProperties: false
  properties:
    expected_row_version: *id002
    reason:
      type: string
      minLength: 1
      maxLength: 1000
  required:
    - expected_row_version
    - reason
ResidentHouseClaim:
  type: object
  additionalProperties: false
  properties:
    id: *id001
    community_id: *id001
    house_id: *id001
    house_label_snapshot: &id005
      type: string
    applicant_name: &id006
      type: string
    applicant_phone: &id007
      type: string
    applicant_remark: &id008
      anyOf:
        - type: string
        - type: 'null'
    status: &id009
      type: string
      enum:
        - pending
        - approved
        - rejected
        - cancelled
    review_reason: &id010
      anyOf:
        - type: string
        - type: 'null'
    reviewed_at: &id011
      anyOf:
        - &id004
          type: string
          format: date-time
        - type: 'null'
    cancelled_at: &id012
      anyOf:
        - *id004
        - type: 'null'
    row_version: *id002
    created_at: *id004
    updated_at: *id004
  required:
    - id
    - community_id
    - house_id
    - house_label_snapshot
    - applicant_name
    - applicant_phone
    - applicant_remark
    - status
    - review_reason
    - reviewed_at
    - cancelled_at
    - row_version
    - created_at
    - updated_at
PropertyHouseClaim:
  type: object
  additionalProperties: false
  properties:
    id: *id001
    community_id: *id001
    house_id: *id001
    house_label_snapshot: *id005
    applicant_name: *id006
    applicant_phone: *id007
    applicant_remark: *id008
    status: *id009
    review_reason: *id010
    reviewed_at: *id011
    cancelled_at: *id012
    row_version: *id002
    created_at: *id004
    updated_at: *id004
    property_company_id: *id001
    user_id: *id001
    match_status:
      type: string
      enum:
        - matched
        - unmatched
    matched_owner_id:
      anyOf:
        - *id001
        - type: 'null'
    reviewed_by_admin_id:
      anyOf:
        - *id001
        - type: 'null'
  required:
    - id
    - community_id
    - house_id
    - house_label_snapshot
    - applicant_name
    - applicant_phone
    - applicant_remark
    - status
    - review_reason
    - reviewed_at
    - cancelled_at
    - row_version
    - created_at
    - updated_at
    - property_company_id
    - user_id
    - match_status
    - matched_owner_id
    - reviewed_by_admin_id
ResidentHouseBinding:
  type: object
  additionalProperties: false
  properties:
    id: *id001
    community_id: *id001
    house_id: *id001
    claim_application_id: *id001
    house_label_snapshot: &id013
      type: string
    status: &id014
      type: string
      enum:
        - active
        - released
        - revoked
    effective_enabled: &id015
      type: boolean
    granted_at: *id004
    ended_at: &id016
      anyOf:
        - *id004
        - type: 'null'
    end_reason: &id017
      anyOf:
        - type: string
        - type: 'null'
    row_version: *id002
    created_at: *id004
    updated_at: *id004
  required:
    - id
    - community_id
    - house_id
    - claim_application_id
    - house_label_snapshot
    - status
    - effective_enabled
    - granted_at
    - ended_at
    - end_reason
    - row_version
    - created_at
    - updated_at
