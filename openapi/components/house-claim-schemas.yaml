  type: object
  additionalProperties: false
  properties:
    id: *id001
    community_id: *id001
    house_id: *id001
    claim_application_id: *id001
    house_label_snapshot: *id013
    status: *id014
    effective_enabled: *id015
    granted_at: *id004
    ended_at: *id016
    end_reason: *id017
    row_version: *id002
    created_at: *id004
    updated_at: *id004
    property_company_id: *id001
    user_id: *id001
    applicant_name:
      type: string
    applicant_phone:
      type: string
  required:
    - id
    - community_id
    - house_id
    - claim_application_id
    - house_label_snapshot
    - status
    - effective_enabled
    - granted_at
    - ended_at
    - end_reason
    - row_version
    - created_at
    - updated_at
    - property_company_id
    - user_id
    - applicant_name
    - applicant_phone
