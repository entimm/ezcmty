BatchId:
  name: batch_id
  in: path
  required: true
  schema:
    $ref: ./schemas.yaml#/UUIDIdentifier
TypeKey:
  name: type_key
  in: path
  required: true
  schema:
    $ref: ./import-schemas.yaml#/ImportTypeKey
VersionNo:
  name: version_no
  in: path
  required: true
  schema:
    type: integer
    minimum: 1
Page:
  name: page
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    default: 1
PageSize:
  name: page_size
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
IdempotencyKey:
  name: Idempotency-Key
  in: header
  required: true
  schema:
    type: string
    pattern: ^[A-Za-z0-9_-]+$
    minLength: 1
    maxLength: 128
  description: 目标公司、当前后台、用户、动作作用域内持久幂等。同键同输入重放首次成功状态与安全响应；同键异输入409。失败且无成功动作不占用键，重放仍复核当前权限。
Origin:
  name: Origin
  in: header
  required: false
  schema:
    anyOf:
      - type: string
      - type: 'null'
  description: 复用现行后台Cookie写请求Origin/CSRF校验；缺失或不合法按现行规则拒绝。
CsrfToken:
  name: X-CSRF-Token
  in: header
  required: false
  schema:
    anyOf:
      - type: string
      - type: 'null'
  description: 复用现行后台CSRF机制，Schema可选不等于跳过安全校验。
