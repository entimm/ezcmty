CompanyCreate:
  type: object
  additionalProperties: false
  properties:
    code: &id002
      description: 编码输入接受任意大小写，匹配、唯一性检查、存储和返回统一使用大写形式。
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
    name:
      type: string
      minLength: 1
      maxLength: 160
    contact_name:
      anyOf:
        - type: string
          minLength: 1
          maxLength: 80
        - type: 'null'
    contact_phone:
      anyOf:
        - type: string
          minLength: 1
          maxLength: 32
        - type: 'null'
  required:
    - code
    - name
CompanyUpdate:
  type: object
  additionalProperties: false
  properties:
    name:
      anyOf:
        - type: string
          minLength: 1
          maxLength: 160
        - type: 'null'
    contact_name:
      anyOf:
        - type: string
          minLength: 1
          maxLength: 80
        - type: 'null'
    contact_phone:
      anyOf:
        - type: string
          minLength: 1
          maxLength: 32
        - type: 'null'
    enabled:
      anyOf:
        - type: boolean
        - type: 'null'
PropertyCompany:
  type: object
  additionalProperties: false
  properties:
    id: &id001
      $ref: ./schemas.yaml#/UUIDIdentifier
    code:
      type: string
      description: 规范化后的大写编码。
    name:
      type: string
    contact_name:
      anyOf:
        - type: string
        - type: 'null'
    contact_phone:
      anyOf:
        - type: string
        - type: 'null'
    enabled:
      type: boolean
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
  required:
    - id
    - code
    - name
    - contact_name
    - contact_phone
    - enabled
    - created_at
    - updated_at
PropertyWorkspaceSummary:
  type: object
  additionalProperties: false
  description: 当前物业公司的工作台运营指标；无对应读取权限的指标返回 null。
  properties:
    billing_month:
      type: string
      pattern: ^\d{4}-(0[1-9]|1[0-2])$
      description: 指标所属账单月份，按 Asia/Shanghai 当前业务月份计算。
    pending_house_claims:
      anyOf:
        - type: integer
          minimum: 0
        - type: 'null'
      description: 待审核房屋认领申请数。
    monthly_receivable_cents:
      anyOf:
        - type: integer
          minimum: 0
        - type: 'null'
      description: 当前月有效物业费账单的应收金额，单位为分。
    monthly_settled_cents:
      anyOf:
        - type: integer
          minimum: 0
        - type: 'null'
      description: 当前月有效物业费账单的已收金额，单位为分。
    pending_reconciliation_count:
      anyOf:
        - type: integer
          minimum: 0
        - type: 'null'
      description: 当前物业公司尚未解决的收款核对差异数。
  required:
    - billing_month
    - pending_house_claims
    - monthly_receivable_cents
    - monthly_settled_cents
    - pending_reconciliation_count
CommunityCreate:
  type: object
  additionalProperties: false
  properties:
    property_company_id: *id001
    code: *id002
    name:
      type: string
      minLength: 1
      maxLength: 160
    address:
      type: string
      minLength: 1
      maxLength: 255
  required:
    - property_company_id
    - code
    - name
    - address
CommunityUpdate:
  type: object
  additionalProperties: false
  properties:
    name:
      anyOf:
        - type: string
          minLength: 1
          maxLength: 160
        - type: 'null'
    address:
      anyOf:
        - type: string
          minLength: 1
          maxLength: 255
        - type: 'null'
    enabled:
      anyOf:
        - type: boolean
        - type: 'null'
Community:
  type: object
  additionalProperties: false
  properties:
    id: *id001
    property_company_id: *id001
    property_company_name:
      type: string
    code:
      type: string
      description: 规范化后的大写编码。
    name:
      type: string
    address:
      type: string
    enabled:
      type: boolean
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
  required:
    - id
    - property_company_id
    - property_company_name
    - code
    - name
    - address
    - enabled
    - created_at
    - updated_at
PropertyAdminCreate:
  type: object
  additionalProperties: false
  properties:
    login_name:
      type: string
      description: 登录名统一使用小写；输入接受任意大小写，匹配、唯一性检查、限流和返回使用小写形式。
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9][A-Za-z0-9_.@-]*$
    display_name:
      type: string
      minLength: 1
      maxLength: 80
    password:
      type: string
      description: 长度按 Unicode 码点计数，不强制字符组合；禁止 CR/LF，保留密码原文及首尾空格。
      minLength: 12
      maxLength: 128
      pattern: '^(?![\s\S]*[\r\n])'
  required:
    - login_name
    - display_name
    - password
PropertyAdminAccount:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ./schemas.yaml#/UUIDIdentifier
    scope:
      type: string
      const: property_admin
    login_name:
      type: string
      description: 登录名统一使用小写；输入接受任意大小写，匹配、唯一性检查、限流和返回使用小写形式。
    display_name:
      type: string
    enabled:
      type: boolean
    must_change_password:
      type: boolean
    created_at:
      type: string
      format: date-time
    roles:
      type: array
      items:
        $ref: ./admin-schemas.yaml#/RoleSummary
    effective_permissions:
      type: array
      items:
        type: string
    property_company_id: *id001
  required:
    - id
    - scope
    - login_name
    - display_name
    - enabled
    - must_change_password
    - created_at
    - roles
    - effective_permissions
    - property_company_id
