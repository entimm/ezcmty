  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: '#/SpaceNode'
    total:
      type: integer
    page:
      type: integer
    page_size:
      type: integer
  required:
    - items
    - total
    - page
    - page_size
HousePage:
  type: object
  additionalProperties: false
  properties:
