RequestId:
  type: string
  pattern: '^[A-Za-z0-9_-]{1,64}$'

HealthResponse:
  type: object
  required:
    - status
    - service
  properties:
    status:
      type: string
      const: ok
    service:
      type: string

ReadinessResponse:
  type: object
  required:
    - status
    - service
    - dependencies
  properties:
    status:
      type: string
      enum: [ok, not_ready]
    service:
      type: string
    dependencies:
      type: object
      additionalProperties:
        type: string
        enum: [ok, unavailable]
