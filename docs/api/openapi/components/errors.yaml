---
ProblemDetails:
  type: object
  description: RFC 9457 Problem Details；错误码和类型关系由本 Schema 的扩展元数据定义。
  required:
    - type
    - title
    - status
    - detail
    - instance
    - code
    - request_id
  properties:
    type:
      type: string
      format: uri
      description: 由 x-error-type-prefix 与 code 拼接生成。
    title:
      type: string
    status:
      type: integer
      minimum: 400
      maximum: 599
    detail:
      type: string
    instance:
      type: string
      format: uri
      description: urn:request:<request_id>，不包含请求 URL 或查询串。
    code:
      type: string
      description: 全局唯一的稳定错误码；客户端应容忍后续新增错误码。
    request_id:
      '$ref': './schemas.yaml#/RequestId'
    errors:
      type: array
      items:
        '$ref': '#/ValidationIssue'
  x-error-type-prefix: 'urn:problem:'
  x-error-catalog:
    request:
      VALIDATION_ERROR:
        status: 422
        title: 请求参数校验失败
      request.bad_request:
        status: 400
        title: 请求无效
      request.method_not_allowed:
        status: 405
        title: 请求方法不允许
    auth:
      auth.unauthenticated:
        status: 401
        title: 需要身份认证
      auth.forbidden:
        status: 403
        title: 没有操作权限
      auth.invalid_credentials:
        status: 401
        title: 登录名或密码错误
      auth.password_change_required:
        status: 403
        title: 请先修改初始密码
      auth.csrf_failed:
        status: 403
        title: 请求校验失败
      auth.invalid_old_password:
        status: 409
        title: 当前密码不正确
      auth.rate_limited:
        status: 429
        title: 登录尝试过于频繁，请稍后再试
    resource:
      resource.not_found:
        status: 404
        title: 资源不存在
      resource.conflict:
        status: 409
        title: 资源状态冲突
    system:
      INTERNAL_ERROR:
        status: 500
        title: 服务内部错误
      system.dependency_unavailable:
        status: 503
        title: 服务暂不可用
    http:
      HTTP_ERROR:
        status:
        title: HTTP 请求失败
        description: 未明确分类的 HTTP 错误回退；仅接受原始 400–599 状态。
    admin:
      admin.duplicate_login:
        status: 409
        title: 登录名已存在
      admin.duplicate_role:
        status: 409
        title: 角色编码已存在
      admin.protected_account:
        status: 409
        title: 不能停用本人或撤销本人超级管理员资格
      admin.last_super_admin:
        status: 409
        title: 必须保留至少一名有效超级管理员
      admin.system_role_readonly:
        status: 409
        title: 系统角色不可修改
      admin.invalid_role:
        status: 409
        title: 角色不可分配，请刷新后重试
      admin.invalid_permission:
        status: 409
        title: 权限不可分配，请刷新后重试
    property:
      property.duplicate_company_code:
        status: 409
        title: 公司编码已存在
      property.duplicate_community_code:
        status: 409
        title: 小区编码已存在
      property.company_admin_required:
        status: 409
        title: 启用公司需要至少一名有效超级管理员
      property.duplicate_space_name:
        status: 409
        title: 同级空间名称已存在
      property.invalid_space_parent:
        status: 409
        title: 不允许的空间父子关系
      property.invalid_house_parent:
        status: 409
        title: 房屋必须属于楼栋或单元
      property.duplicate_room_no:
        status: 409
        title: 所属位置的房号已存在
      property.duplicate_house_owner:
        status: 409
        title: 该房屋的业主登记已存在
      property.housing_disabled:
        status: 409
        title: 所属小区、空间或房屋已停用
    billing:
      billing.basis_changed:
        status: 409
        title: 计费依据或计算结果已变化，请重新核对
      billing.basis_missing:
        status: 409
        title: 该月份没有适用计费依据
      billing.basis_version_conflict:
        status: 409
        title: 计费依据版本已变化，请刷新
      billing.bill_exists:
        status: 409
        title: 该房屋月份已有有效账单
      billing.version_conflict:
        status: 409
        title: 账单已变化，请刷新后核对
      billing.overpayment:
        status: 409
        title: 登记金额超过账单应收范围
      billing.bill_voided:
        status: 409
        title: 账单已作废
      billing.bill_has_settlement:
        status: 409
        title: 账单存在有效收款，不能作废
      billing.receipt_already_reversed:
        status: 409
        title: 该收款已被冲正
      billing.invalid_receipt:
        status: 409
        title: 该条目不是可纠错的原始收款
      billing.idempotency_conflict:
        status: 409
        title: 幂等键已用于其他请求
      billing.house_label_too_long:
        status: 409
        title: 房屋位置超过账单长度限制
      billing.invalid_reference:
        status: 409
        title: 参考依据不适用于该房屋月份
      billing.amount_out_of_range:
        status: 409
        title: 计费金额超过支持范围
    resident:
      resident.state_changed:
        status: 409
        title: 状态已变化，请刷新后重试
      resident.phone_unavailable:
        status: 409
        title: 请选择本人有效的手机号
      resident.already_claimed:
        status: 409
        title: 已绑定该房屋
      resident.duplicate_claim:
        status: 409
        title: 该房屋已有待审核申请
      resident.idempotency_conflict:
        status: 409
        title: 请求标识已被其他操作使用
      resident.housing_unavailable:
        status: 409
        title: 房屋或所属物业暂不可用
      resident.reason_required:
        status: 422
        title: 请填写核实或处理说明
      resident.rate_limited:
        status: 429
        title: 操作过于频繁，请稍后再试
    wechat:
      wechat.invalid_code:
        status: 422
        title: 微信授权已失效，请重新授权
      wechat.phone_mismatch:
        status: 409
        title: 微信授权号码与填写号码不一致
      wechat.unsupported_phone:
        status: 422
        title: 暂仅支持中国大陆手机号

ValidationIssue:
  type: object
  required:
    - location
    - type
  properties:
    location:
      type: array
      items:
        anyOf:
          - type: string
          - type: integer
    type:
      type: string
