    accepted_at:
      type: string
      format: date-time
      description: 带时区 RFC 3339；响应统一为 UTC Z。
  required:
    - target_type
    - target_id
    - accepted_at
  description: 202 表示任务已可靠持久化或已存在的任务被合并，不表示付款、分账、解冻或差异已经成功；查询原资源确认。
