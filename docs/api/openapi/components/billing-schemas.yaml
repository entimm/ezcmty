FeeBasisVersion:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ./schemas.yaml#/UUIDIdentifier
    house_id:
      $ref: ./schemas.yaml#/UUIDIdentifier
    version_no:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    effective_from_month:
      type: string
      pattern: ^\d{4}-(0[1-9]|1[0-2])$
    house_usage:
      type: string
      enum:
        - residential
        - commercial
        - office
        - other
    area_sqm:
      anyOf:
        - type: string
          pattern: ^(?:0|[1-9]\d{0,7})(?:\.\d{1,4})?$
        - type: 'null'
    unit_price_cents:
      anyOf:
        - type: integer
          minimum: 0
          maximum: 9007199254740991
        - type: 'null'
    fixed_amount_cents:
      anyOf:
        - type: integer
          minimum: 0
          maximum: 9007199254740991
        - type: 'null'
    change_reason:
      type: string
      minLength: 1
      maxLength: 1000
    created_by:
      $ref: ./schemas.yaml#/UUIDIdentifier
    created_at:
      type: string
      format: date-time
  required:
    - id
    - house_id
    - version_no
    - effective_from_month
    - house_usage
    - area_sqm
    - unit_price_cents
    - fixed_amount_cents
    - change_reason
    - created_by
    - created_at
FeeBasisCreate:
  type: object
  additionalProperties: false
  properties:
    expected_latest_version_no:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    effective_from_month:
      type: string
      pattern: ^\d{4}-(0[1-9]|1[0-2])$
    house_usage:
      type: string
      enum:
        - residential
        - commercial
        - office
        - other
    area_sqm:
      anyOf:
        - type: string
          pattern: ^(?:0|[1-9]\d{0,7})(?:\.\d{1,4})?$
        - type: 'null'
    unit_price_cents:
      anyOf:
        - type: integer
          minimum: 0
          maximum: 9007199254740991
        - type: 'null'
    fixed_amount_cents:
      anyOf:
        - type: integer
          minimum: 0
          maximum: 9007199254740991
        - type: 'null'
    change_reason:
      type: string
      minLength: 1
      maxLength: 1000
  required:
    - expected_latest_version_no
    - effective_from_month
    - house_usage
    - change_reason
FeeCalculationRequest:
  type: object
  additionalProperties: false
  properties:
    billing_month:
      type: string
      pattern: ^\d{4}-(0[1-9]|1[0-2])$
  required:
    - billing_month
FeeCalculation:
  type: object
  additionalProperties: false
  properties:
    available:
      type: boolean
    billing_month:
      type: string
      pattern: ^\d{4}-(0[1-9]|1[0-2])$
    period_start:
      type: string
      format: date
    period_end:
      type: string
      format: date
    house_label_snapshot:
      type: string
      minLength: 1
      maxLength: 512
    basis:
      anyOf:
        - $ref: ./billing-schemas.yaml#/FeeBasisVersion
        - type: 'null'
    calculation_method:
      anyOf:
        - type: string
          enum:
            - fixed
            - area_rate
        - type: 'null'
    calculation_rule_version:
      anyOf:
        - type: integer
          minimum: 1
          maximum: 32767
        - type: 'null'
    receivable_cents:
      anyOf:
        - type: integer
          minimum: 0
          maximum: 9007199254740991
        - type: 'null'
  required:
    - available
    - billing_month
    - period_start
    - period_end
    - house_label_snapshot
    - basis
    - calculation_method
    - calculation_rule_version
    - receivable_cents
InitialReceipt:
  type: object
  additionalProperties: false
  properties:
    amount_cents:
      type: integer
      exclusiveMinimum: 0
      maximum: 9007199254740991
    received_on:
      anyOf:
        - type: string
          format: date
        - type: 'null'
    reason:
      anyOf:
        - type: string
          minLength: 1
          maxLength: 1000
        - type: 'null'
  required:
    - amount_cents
BillCreate:
  type: object
  additionalProperties: false
  properties:
    house_id:
      $ref: ./schemas.yaml#/UUIDIdentifier
    bill_type:
      type: string
      const: property_fee
      default: property_fee
    billing_month:
      type: string
      pattern: ^\d{4}-(0[1-9]|1[0-2])$
    amount_source:
      type: string
      enum:
        - basis
        - manual
    basis_version_id:
      anyOf:
        - $ref: ./schemas.yaml#/UUIDIdentifier
        - type: 'null'
    expected_calculation_rule_version:
      anyOf:
        - type: integer
          minimum: 1
          maximum: 32767
        - type: 'null'
    expected_receivable_cents:
      anyOf:
        - type: integer
          minimum: 0
          maximum: 9007199254740991
        - type: 'null'
    receivable_cents:
      anyOf:
        - type: integer
          minimum: 0
          maximum: 9007199254740991
        - type: 'null'
    manual_amount_reason:
      anyOf:
        - type: string
          minLength: 1
          maxLength: 1000
        - type: 'null'
    external_bill_no:
      anyOf:
        - type: string
          maxLength: 128
        - type: 'null'
    due_date:
      anyOf:
        - type: string
          format: date
        - type: 'null'
    initial_receipt:
      anyOf:
        - $ref: ./billing-schemas.yaml#/InitialReceipt
        - type: 'null'
  required:
    - house_id
    - billing_month
    - amount_source
BillUpdate:
  type: object
  additionalProperties: false
  properties:
    expected_row_version:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    external_bill_no:
      anyOf:
        - type: string
          maxLength: 128
        - type: 'null'
    due_date:
      anyOf:
        - type: string
          format: date
        - type: 'null'
  required:
    - expected_row_version
ReceiptCreate:
  type: object
  additionalProperties: false
  properties:
    expected_row_version:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    amount_cents:
      type: integer
      exclusiveMinimum: 0
      maximum: 9007199254740991
    received_on:
      anyOf:
        - type: string
          format: date
        - type: 'null'
    reason:
      anyOf:
        - type: string
          minLength: 1
          maxLength: 1000
        - type: 'null'
  required:
    - expected_row_version
    - amount_cents
ReceiptCorrection:
  type: object
  additionalProperties: false
  properties:
    expected_row_version:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    corrected_amount_cents:
      type: integer
      exclusiveMinimum: 0
      maximum: 9007199254740991
    corrected_received_on:
      anyOf:
        - type: string
          format: date
        - type: 'null'
    reason:
      type: string
      minLength: 1
      maxLength: 1000
  required:
    - expected_row_version
    - corrected_amount_cents
    - corrected_received_on
    - reason
BillReasonAction:
  type: object
  additionalProperties: false
  properties:
    expected_row_version:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    reason:
      type: string
      minLength: 1
      maxLength: 1000
  required:
    - expected_row_version
    - reason
Bill:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ./schemas.yaml#/UUIDIdentifier
    property_company_id:
      $ref: ./schemas.yaml#/UUIDIdentifier
    community_id:
      $ref: ./schemas.yaml#/UUIDIdentifier
    house_id:
      $ref: ./schemas.yaml#/UUIDIdentifier
    bill_type:
      type: string
      const: property_fee
    period_granularity:
      type: string
      const: month
    billing_month:
      type: string
      pattern: ^\d{4}-(0[1-9]|1[0-2])$
    period_start:
      type: string
      format: date
    period_end:
      type: string
      format: date
    external_bill_no:
      anyOf:
        - type: string
          maxLength: 128
        - type: 'null'
    basis_version_id:
      anyOf:
        - $ref: ./schemas.yaml#/UUIDIdentifier
        - type: 'null'
    amount_source:
      type: string
      enum:
        - basis
        - manual
    calculation_rule_version:
      anyOf:
        - type: integer
          minimum: 1
          maximum: 32767
        - type: 'null'
    receivable_cents:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    settled_cents:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    outstanding_cents:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    lifecycle_status:
      type: string
      enum:
        - active
        - voided
    settlement_status:
      anyOf:
        - type: string
          enum:
            - unpaid
            - partially_settled
            - settled
        - type: 'null'
    due_date:
      anyOf:
        - type: string
          format: date
        - type: 'null'
    is_overdue:
      type: boolean
    house_label_snapshot:
      type: string
      minLength: 1
      maxLength: 512
    manual_amount_reason:
      anyOf:
        - type: string
          minLength: 1
          maxLength: 1000
        - type: 'null'
    void_reason:
      anyOf:
        - type: string
          minLength: 1
          maxLength: 1000
        - type: 'null'
    voided_at:
      anyOf:
        - type: string
          format: date-time
        - type: 'null'
    voided_by:
      anyOf:
        - $ref: ./schemas.yaml#/UUIDIdentifier
        - type: 'null'
    row_version:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    created_by:
      $ref: ./schemas.yaml#/UUIDIdentifier
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    basis:
      anyOf:
        - $ref: ./billing-schemas.yaml#/FeeBasisVersion
        - type: 'null'
    house_effective_enabled:
      type: boolean
    payment_in_progress:
      type: boolean
      description: 由 bill_payment_reservations 是否存在当前占用派生，仅用于管理端展示和操作提示；不在 bills 表持久化，不公开占用者身份或支付订单号。建立或释放占用不递增账单版本，写入时仍须在账单锁内重新检查。
  required:
    - id
    - property_company_id
    - community_id
    - house_id
    - bill_type
    - period_granularity
    - billing_month
    - period_start
    - period_end
    - external_bill_no
    - basis_version_id
    - amount_source
    - calculation_rule_version
    - receivable_cents
    - settled_cents
    - outstanding_cents
    - lifecycle_status
    - settlement_status
    - due_date
    - is_overdue
    - house_label_snapshot
    - manual_amount_reason
    - void_reason
    - voided_at
    - voided_by
    - row_version
    - created_by
    - created_at
    - updated_at
    - basis
    - house_effective_enabled
    - payment_in_progress
SettlementEntry:
  type: object
  additionalProperties: false
  description: 物业管理端账务流水。offline 由管理员登记，payment_order_item_id 为空；online_payment 为系统确认的线上收款，payment_order_item_id 非空、entry_type 为 receipt、received_on 非空，actor_type 为 system。线上收款不允许通过线下纠错或撤销登记冲正。不返回付款人身份、渠道单号、调起凭证或原始渠道内容。
  properties:
    id:
      $ref: ./schemas.yaml#/UUIDIdentifier
    bill_id:
      $ref: ./schemas.yaml#/UUIDIdentifier
    operation_id:
      $ref: ./schemas.yaml#/UUIDIdentifier
    entry_type:
      type: string
      enum:
        - receipt
        - reversal
    source_type:
      type: string
      enum:
        - offline
        - online_payment
      description: 业务来源，不表示支付渠道。
    payment_order_item_id:
      anyOf:
        - $ref: ./schemas.yaml#/UUIDIdentifier
        - type: 'null'
      description: 线上收款关联的支付明细 ID，与本条明细属于同一账单；offline 时为空，online_payment 时非空。
    amount_cents:
      type: integer
      minimum: -9007199254740991
      maximum: 9007199254740991
    reverses_entry_id:
      anyOf:
        - $ref: ./schemas.yaml#/UUIDIdentifier
        - type: 'null'
    reversed_by_entry_id:
      anyOf:
        - $ref: ./schemas.yaml#/UUIDIdentifier
        - type: 'null'
    received_on:
      anyOf:
        - type: string
          format: date
        - type: 'null'
      description: 原收款业务日期；线下历史日期不详允许为空，线上按可信支付成功时间转换为 Asia/Shanghai 日期，不使用通知到达或处理日期。
    created_at:
      type: string
      format: date-time
    actor_type:
      type: string
      enum:
        - admin
        - system
      description: 来自关联账单操作；线下收款和冲正为 admin，线上收款为 system。
    actor_id:
      anyOf:
        - $ref: ./schemas.yaml#/UUIDIdentifier
        - type: 'null'
      description: 管理员标识；actor_type 为 admin 时非空，为 system 时为空，不使用付款人身份代替。
    actor_name:
      type: string
      description: 管理员显示名；actor_type 为 system 时固定显示“系统”。
    reason:
      anyOf:
        - type: string
          minLength: 1
          maxLength: 1000
        - type: 'null'
  required:
    - id
    - bill_id
    - operation_id
    - entry_type
    - source_type
    - payment_order_item_id
    - amount_cents
    - reverses_entry_id
    - reversed_by_entry_id
    - received_on
    - created_at
    - actor_type
    - actor_id
    - actor_name
    - reason
BillOperation:
  type: object
  additionalProperties: false
  description: 管理员操作和系统线上入账的只读历史。actor_type 为 admin 时 actor_id 非空且 action 不能为 online_receipt；为 system 时 action 仅为 online_receipt、actor_id 为空。系统线上入账的支付关联由该操作的结算明细提供，不返回付款人身份或渠道凭证。
  properties:
    id:
      $ref: ./schemas.yaml#/UUIDIdentifier
    bill_id:
      $ref: ./schemas.yaml#/UUIDIdentifier
    action:
      type: string
      enum:
        - create
        - update
        - receipt
        - online_receipt
        - correct_receipt
        - reverse_receipt
        - void
    bill_version:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    actor_type:
      type: string
      enum:
        - admin
        - system
    actor_id:
      anyOf:
        - $ref: ./schemas.yaml#/UUIDIdentifier
        - type: 'null'
      description: 管理员标识；actor_type 为 admin 时非空，为 system 时为空。
    actor_name:
      type: string
      description: 管理员显示名；actor_type 为 system 时固定显示“系统”。
    reason:
      anyOf:
        - type: string
          minLength: 1
          maxLength: 1000
        - type: 'null'
    request_id:
      type: string
      pattern: ^[A-Za-z0-9_-]{1,64}$
      description: 管理员操作的请求诊断标识，或系统线上入账的处理链路标识，不承担幂等职责。
    created_at:
      type: string
      format: date-time
  required:
    - id
    - bill_id
    - action
    - bill_version
    - actor_type
    - actor_id
    - actor_name
    - reason
    - request_id
    - created_at
BillWriteResult:
  type: object
  additionalProperties: false
  properties:
    bill:
      $ref: ./billing-schemas.yaml#/Bill
    operation:
      $ref: ./billing-schemas.yaml#/BillOperation
    settlement_entries:
      type: array
      items:
        $ref: ./billing-schemas.yaml#/SettlementEntry
