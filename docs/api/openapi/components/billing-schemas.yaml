    - operation
    - settlement_entries
BillOperationResult:
  type: object
  additionalProperties: false
  description: 仅用于原管理员核实自身操作的首次成功 HTTP 状态与结果；系统线上入账不通过此接口公开内部结果快照。
  properties:
    response_status:
      type: integer
    result:
      $ref: ./billing-schemas.yaml#/BillWriteResult
  required:
    - response_status
    - result
