sessions:
  post:
    operationId: createAdminSession
    x-runtimes:
      - platform_admin_api
    tags:
      - admin
    summary: 登录并创建后台会话
    description:
      登录失败不区分账号不存在、密码错误和停用。按账号与来源 IP 限流；密码不得自动重试。成功设置本端 Host-only、HttpOnly
      会话 Cookie，受限会话只允许当前会话、本人改密和退出。响应禁止缓存。
    security: []
    responses:
      '201':
        description: 操作成功
        headers:
          X-Request-ID:
            $ref: ../components/headers.yaml#/RequestId
          Cache-Control:
            schema:
              type: string
          Set-Cookie:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/admin-schemas.yaml#/AdminSession
      '401':
        $ref: ../components/responses.yaml#/AdminProblem
      '403':
        $ref: ../components/responses.yaml#/AdminProblem
      '422':
        $ref: ../components/responses.yaml#/AdminProblem
      '429':
        $ref: ../components/responses.yaml#/AdminProblem
      '500':
        $ref: ../components/responses.yaml#/AdminProblem
      '503':
        $ref: ../components/responses.yaml#/AdminProblem
    parameters:
      - name: Origin
        in: header
        required: false
        schema:
          anyOf:
            - type: string
            - type: 'null'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/admin-schemas.yaml#/AdminLogin
