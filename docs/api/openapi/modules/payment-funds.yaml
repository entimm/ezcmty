    security:
      - AdminSession: []
    x-permissions-by-runtime:
      platform_admin_api:
        - platform.payment.read
      property_admin_api:
        - property.payment.read
    parameters:
      - name: payment_order_id
        in: path
        required: true
        schema:
          $ref: ../components/schemas.yaml#/UUIDIdentifier
    responses:
      '200':
        description: 操作成功。
        headers:
          X-Request-ID:
            $ref: ../components/headers.yaml#/RequestId
          Cache-Control:
            schema:
              type: string
              const: no-store
            description: 敏感管理数据禁止缓存。
        content:
          application/json:
            schema:
              $ref: ../components/payment-management-schemas.yaml#/ManagedPaymentOrder
      '401':
        $ref: ../components/responses.yaml#/AdminProblem
      '403':
        $ref: ../components/responses.yaml#/AdminProblem
      '404':
        $ref: ../components/responses.yaml#/AdminProblem
      '409':
        $ref: ../components/responses.yaml#/AdminProblem
      '422':
        $ref: ../components/responses.yaml#/AdminProblem
      '500':
        $ref: ../components/responses.yaml#/AdminProblem
      '503':
        $ref: ../components/responses.yaml#/AdminProblem
