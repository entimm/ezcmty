paymentOrderRecoveries:
  post:
    operationId: recoverManagedPaymentOrder
    x-runtimes:
      - platform_admin_api
    tags:
      - payment-management
    summary: 恢复原支付资金流程
    description:
      复核渠道事实后，按原单恢复查单、正常关单、入账、分账或解冻；未知执行先查原单，只有明确失败的未成功金额才能合法补执行。禁止指定成功、直接删除占用、跳过应分解冻或改写金额。 要求独立操作权限；在锁内复核 expected_state_token，过期返回
      409 resource.conflict；当前资金事实不允许恢复时返回 payment.recovery_not_allowed。重复触发合并原目标持久任务，不能重复资金执行；接受任务与管理员原因审计同事务提交。读取权限不隐含恢复权限。
      所有请求校验完整管理会话、当前权限和资源范围；越界返回 404。 写入要求可信 Origin 和当前会话 CSRF；不自动换键重试。
    security:
      - AdminSession: []
    x-permissions:
      - platform.payment_funds.recover
    parameters:
      - name: payment_order_id
        in: path
        required: true
        schema:
          $ref: ../components/schemas.yaml#/UUIDIdentifier
      - name: Origin
        in: header
        required: true
        schema:
          type: string
          maxLength: 2048
        description: 必须为受信后台 Origin；缺失或不可信拒绝。
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          maxLength: 256
        description: 必须匹配当前完整管理会话。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/payment-management-schemas.yaml#/PaymentRecoveryRequest
    responses:
      '202':
        description: 已可靠接受任务，查询原资源确认结果。
        headers:
          X-Request-ID:
            $ref: ../components/headers.yaml#/RequestId
          Cache-Control:
            schema:
              type: string
              const: no-store
            description: 敏感管理数据禁止缓存。
        content:
          application/json:
            schema:
              $ref: ../components/payment-management-schemas.yaml#/PaymentRecoveryAccepted
      '401':
        $ref: ../components/responses.yaml#/AdminProblem
      '403':
        $ref: ../components/responses.yaml#/AdminProblem
      '404':
        $ref: ../components/responses.yaml#/AdminProblem
      '409':
        $ref: ../components/responses.yaml#/AdminProblem
      '422':
        $ref: ../components/responses.yaml#/AdminProblem
      '500':
        $ref: ../components/responses.yaml#/AdminProblem
      '503':
        $ref: ../components/responses.yaml#/AdminProblem
