paymentOrders:
  get:
    operationId: listManagedPaymentOrders
    x-runtimes:
      - platform_admin_api
      - property_admin_api
    tags:
      - payment-management
    summary: 查询支付订单
    description:
      本期物业按认证公司限定完整业务记录，不引入指定小区授权；未来引入小区授权时，再按支付明细关联账单核验，越界返回 404。若订单包含不可访问明细，则整单不返回，不能只展示部分金额后伪装完整订单。平台按所授范围读取。
      只返回该资源权限内业务白名单，不读取原始通知、请求报文或技术日志。 所有请求校验完整管理会话、当前权限和资源范围；越界返回 404。GET 只读本地事实，可安全重试。
    security:
      - AdminSession: []
    x-permissions-by-runtime:
      platform_admin_api:
        - platform.payment.read
      property_admin_api:
        - property.payment.read
    parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
            - created_at,id
            - -created_at,-id
          default: -created_at,-id
      - name: property_company_id
        in: query
        required: false
        schema:
          $ref: ../components/schemas.yaml#/UUIDIdentifier
        description: 仅平台可用；物业提交此参数返回 422，不能切换公司。
      - name: community_id
        in: query
        required: false
        schema:
          $ref: ../components/schemas.yaml#/UUIDIdentifier
        description: 按支付明细关联账单筛选；本期仍以认证公司授权，不建立指定小区授权。未来引入小区授权时再与授权范围相交。
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
            - pending
            - unknown
            - payable
            - closing
            - succeeded
            - closed
      - name: order_no
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 64
        description: 系统业务单号精确匹配。
      - name: created_from
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: 含边界，必须带时区。
      - name: created_before
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: 不含边界，必须晚于 created_from。
      - name: house_id
        in: query
        required: false
        description: 按支付明细关联账单的房屋精确筛选，仍受当前公司范围限制。
        schema:
          $ref: ../components/schemas.yaml#/UUIDIdentifier
      - name: channel_transaction_no
        in: query
        required: false
        description: 渠道支付交易号精确匹配。
        schema:
          type: string
          minLength: 1
          maxLength: 64
      - name: confirmation_status
        in: query
        required: false
        description: 按可信收款证据及本地入账事实派生筛选；awaiting_posting 表示已收款待入账。
        schema:
          type: string
          enum:
            - unconfirmed
            - awaiting_posting
            - posted
    responses:
      '200':
        description: 操作成功。
        headers:
          X-Request-ID:
            $ref: ../components/headers.yaml#/RequestId
          Cache-Control:
            schema:
              type: string
              const: no-store
            description: 敏感管理数据禁止缓存。
        content:
          application/json:
            schema:
              $ref: ../components/payment-management-schemas.yaml#/ManagedPaymentOrderPage
      '401':
        $ref: ../components/responses.yaml#/AdminProblem
      '403':
        $ref: ../components/responses.yaml#/AdminProblem
      '404':
        $ref: ../components/responses.yaml#/AdminProblem
      '409':
        $ref: ../components/responses.yaml#/AdminProblem
      '422':
        $ref: ../components/responses.yaml#/AdminProblem
      '500':
        $ref: ../components/responses.yaml#/AdminProblem
      '503':
        $ref: ../components/responses.yaml#/AdminProblem
paymentOrder:
  get:
    operationId: getManagedPaymentOrder
    x-runtimes:
      - platform_admin_api
      - property_admin_api
    tags:
