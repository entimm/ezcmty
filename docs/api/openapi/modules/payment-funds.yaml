      所有请求校验完整管理会话、当前权限和资源范围；越界返回 404。GET 只读本地事实，可安全重试。
    security:
      - AdminSession: []
    x-permissions-by-runtime:
      platform_admin_api:
        - platform.payment_reconciliation.read
      property_admin_api:
        - property.payment_reconciliation.read
    parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
            - created_at,id
            - -created_at,-id
          default: -created_at,-id
      - name: property_company_id
        in: query
        required: false
        schema:
          $ref: ../components/schemas.yaml#/UUIDIdentifier
        description: 仅平台可用，物业提交返回 422。
      - name: business_date_from
        in: query
        required: false
        schema:
          type: string
          format: date
        description: 含边界。
      - name: business_date_through
        in: query
        required: false
        schema:
          type: string
          format: date
        description: 含边界，必须不早于开始日期。
      - name: statement_type
        in: query
        required: false
        schema:
          type: string
          enum:
            - trade
            - profit_sharing
            - platform_fundflow
        description: 物业不能请求 platform_fundflow，返回 404。
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
