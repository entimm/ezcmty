              const: no-store
            description: 敏感管理数据禁止缓存。
        content:
          application/json:
            schema:
              $ref: ../components/payment-management-schemas.yaml#/ManagedReconciliationRunPage
      '401':
        $ref: ../components/responses.yaml#/AdminProblem
      '403':
        $ref: ../components/responses.yaml#/AdminProblem
      '404':
        $ref: ../components/responses.yaml#/AdminProblem
      '409':
        $ref: ../components/responses.yaml#/AdminProblem
      '422':
        $ref: ../components/responses.yaml#/AdminProblem
      '500':
        $ref: ../components/responses.yaml#/AdminProblem
      '503':
        $ref: ../components/responses.yaml#/AdminProblem
