companies:
  get:
    operationId: listPropertyCompanies
    x-runtimes:
      - platform_admin_api
    tags:
      - property
    summary: 查询物业公司
    description: 所有操作要求平台完整会话及声明的权限；越界资源返回 404。写请求校验 Origin 与 CSRF，不自动重试。
    x-permissions:
      - property.company.read
    security:
      - AdminSession: []
    responses:
      '200':
        description: 操作成功
        headers:
          X-Request-ID:
            $ref: ../components/headers.yaml#/RequestId
        content:
          application/json:
            schema:
              $ref: ../components/property-schemas.yaml#/CompanyPage
      '401':
        $ref: ../components/responses.yaml#/AdminProblem
      '403':
        $ref: ../components/responses.yaml#/AdminProblem
      '404':
        $ref: ../components/responses.yaml#/AdminProblem
      '409':
        $ref: ../components/responses.yaml#/AdminProblem
      '422':
        $ref: ../components/responses.yaml#/AdminProblem
      '500':
        $ref: ../components/responses.yaml#/AdminProblem
      '503':
        $ref: ../components/responses.yaml#/AdminProblem
    parameters:
      - &id004
        name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - &id005
        name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - &id006
        name: name
        in: query
        required: false
        schema:
          anyOf:
            - type: string
              maxLength: 160
            - type: 'null'
      - &id007
        name: code
        in: query
        required: false
        schema:
          anyOf:
            - type: string
              maxLength: 64
            - type: 'null'
      - &id008
        name: enabled
        in: query
        required: false
        schema:
          anyOf:
            - type: boolean
            - type: 'null'
      - &id009
        name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
            - created_at
            - -created_at
          default: -created_at
  post:
    operationId: createPropertyCompany
    x-runtimes:
      - platform_admin_api
    tags:
      - property
    summary: 创建物业公司
    description:
      新公司默认停用，公司编码全平台唯一且固定；重复编码返回 property.duplicate_company_code。所有操作要求平台完整会话及声明的权限；越界资源返回
      404。写请求校验 Origin 与 CSRF，不自动重试。
    x-permissions:
      - property.company.create
    security:
      - AdminSession: []
    responses:
      '201':
        description: 操作成功
        headers:
          X-Request-ID:
            $ref: ../components/headers.yaml#/RequestId
        content:
          application/json:
            schema:
              $ref: ../components/property-schemas.yaml#/PropertyCompany
      '401':
        $ref: ../components/responses.yaml#/AdminProblem
      '403':
        $ref: ../components/responses.yaml#/AdminProblem
      '404':
        $ref: ../components/responses.yaml#/AdminProblem
      '409':
        $ref: ../components/responses.yaml#/AdminProblem
      '422':
        $ref: ../components/responses.yaml#/AdminProblem
      '500':
        $ref: ../components/responses.yaml#/AdminProblem
      '503':
        $ref: ../components/responses.yaml#/AdminProblem
    parameters:
      - &id002
        name: Origin
        in: header
        required: false
        schema:
          anyOf:
            - type: string
            - type: 'null'
      - &id003
        name: X-CSRF-Token
        in: header
        required: false
        schema:
          anyOf:
            - type: string
            - type: 'null'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/property-schemas.yaml#/CompanyCreate
