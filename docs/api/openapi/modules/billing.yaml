basisVersions:
  get:
    operationId: listFeeBasisVersions
    x-runtimes:
      - property_admin_api
    x-permissions:
      - property.fee_basis.read
    tags:
      - billing
    summary: 查询房屋计费依据历史
    description: 按版本号倒序分页，仅返回当前公司、指定小区和房屋的不可变完整版本。
    security:
      - AdminSession: []
    parameters:
      - name: community_id
        in: path
        required: true
        schema:
          $ref: ../components/schemas.yaml#/UUIDIdentifier
      - name: house_id
        in: path
        required: true
        schema:
          $ref: ../components/schemas.yaml#/UUIDIdentifier
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    responses:
      '401':
        $ref: ../components/responses.yaml#/AdminProblem
      '403':
        $ref: ../components/responses.yaml#/AdminProblem
      '404':
        $ref: ../components/responses.yaml#/AdminProblem
      '409':
        $ref: ../components/responses.yaml#/AdminProblem
      '422':
        $ref: ../components/responses.yaml#/AdminProblem
      '500':
        $ref: ../components/responses.yaml#/AdminProblem
      '503':
        $ref: ../components/responses.yaml#/AdminProblem
      '200':
        description: 操作成功
        headers:
          X-Request-ID:
            $ref: ../components/headers.yaml#/RequestId
        content:
          application/json:
            schema:
              $ref: ../components/billing-schemas.yaml#/FeeBasisPage
  post:
    operationId: createFeeBasisVersion
    x-runtimes:
      - property_admin_api
    x-permissions:
      - property.fee_basis.create
    tags:
      - billing
    summary: 新增计费依据版本
    description:
      房屋及上级必须启用。携带 expected_latest_version_no（无历史为 0），锁定房屋后核对最新版本并分配下一版本号。版本按整月生效，同月更正只追加版本，不修改旧账单。固定金额非空时优先采用，包括
      0；否则面积乘每平方米月单价并最终四舍五入到分。
    security:
      - AdminSession: []
    parameters:
      - name: community_id
        in: path
        required: true
        schema:
          $ref: ../components/schemas.yaml#/UUIDIdentifier
      - name: house_id
        in: path
        required: true
        schema:
          $ref: ../components/schemas.yaml#/UUIDIdentifier
      - name: Origin
        in: header
        required: false
        schema:
          anyOf:
            - type: string
            - type: 'null'
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          anyOf:
            - type: string
            - type: 'null'
    responses:
      '401':
        $ref: ../components/responses.yaml#/AdminProblem
      '403':
        $ref: ../components/responses.yaml#/AdminProblem
      '404':
        $ref: ../components/responses.yaml#/AdminProblem
      '409':
        $ref: ../components/responses.yaml#/AdminProblem
      '422':
        $ref: ../components/responses.yaml#/AdminProblem
      '500':
        $ref: ../components/responses.yaml#/AdminProblem
      '503':
        $ref: ../components/responses.yaml#/AdminProblem
      '201':
        description: 操作成功
        headers:
          X-Request-ID:
            $ref: ../components/headers.yaml#/RequestId
        content:
          application/json:
            schema:
              $ref: ../components/billing-schemas.yaml#/FeeBasisVersion
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/billing-schemas.yaml#/FeeBasisCreate
