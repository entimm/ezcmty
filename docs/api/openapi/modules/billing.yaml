bills:
  get:
    operationId: listBills
    x-runtimes:
      - property_admin_api
    x-permissions:
      - property.bill.read
    tags:
      - billing
    summary: 分页查询账单
    description:
      公司范围来自认证上下文。默认查询全部月份的有效账单；outstanding_only=true 查询待缴账单。空间筛选包含后代；外部编号区分大小写且精确匹配。is_overdue
      按 Asia/Shanghai 的业务日、到期日早于今天且仍有待缴计算。记录与总数使用同一语句快照，空页仍返回总数。
    security:
      - AdminSession: []
    parameters:
      - name: community_id
        in: path
        required: true
        schema:
          $ref: ../components/schemas.yaml#/UUIDIdentifier
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: house_id
        in: query
        required: false
        schema:
          anyOf:
            - $ref: ../components/schemas.yaml#/UUIDIdentifier
            - type: 'null'
      - name: space_node_id
        in: query
        required: false
        schema:
          anyOf:
            - $ref: ../components/schemas.yaml#/UUIDIdentifier
            - type: 'null'
      - name: billing_month_from
        in: query
        required: false
        schema:
          anyOf:
            - type: string
              pattern: ^\d{4}-(0[1-9]|1[0-2])$
            - type: 'null'
      - name: billing_month_to
        in: query
        required: false
        schema:
          anyOf:
            - type: string
              pattern: ^\d{4}-(0[1-9]|1[0-2])$
            - type: 'null'
      - name: lifecycle_status
        in: query
        required: false
        schema:
          type: string
          enum:
            - active
            - voided
          default: active
      - name: settlement_status
        in: query
        required: false
        schema:
          anyOf:
            - type: string
              enum:
                - unpaid
                - partially_settled
                - settled
            - type: 'null'
      - name: outstanding_only
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: external_bill_no
        in: query
        required: false
        schema:
          anyOf:
            - type: string
              maxLength: 128
            - type: 'null'
      - name: due_date_from
        in: query
        required: false
        schema:
          anyOf:
            - type: string
              format: date
            - type: 'null'
      - name: due_date_to
        in: query
        required: false
        schema:
          anyOf:
            - type: string
              format: date
            - type: 'null'
      - name: is_overdue
        in: query
        required: false
        schema:
          anyOf:
            - type: boolean
            - type: 'null'
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
            - -period_start
            - period_start
            - -created_at
            - created_at
            - due_date
            - -due_date
            - receivable_cents
            - -receivable_cents
            - outstanding_cents
            - -outstanding_cents
          default: -period_start
    responses:
      '401':
        $ref: ../components/responses.yaml#/AdminProblem
      '403':
        $ref: ../components/responses.yaml#/AdminProblem
      '404':
        $ref: ../components/responses.yaml#/AdminProblem
      '409':
        $ref: ../components/responses.yaml#/AdminProblem
      '422':
        $ref: ../components/responses.yaml#/AdminProblem
      '500':
        $ref: ../components/responses.yaml#/AdminProblem
      '503':
        $ref: ../components/responses.yaml#/AdminProblem
      '200':
        description: 操作成功
        headers:
          X-Request-ID:
            $ref: ../components/headers.yaml#/RequestId
        content:
          application/json:
            schema:
              $ref: ../components/billing-schemas.yaml#/BillPage
  post:
    operationId: createBill
    x-runtimes:
      - property_admin_api
    x-permissions:
      - property.bill.create
    tags:
      - billing
    summary: 手动建立月度物业费账单
    description:
      需要 Idempotency-Key。同公司相同键和规范化输入重放首次成功结果，同键不同输入返回 409。自动计算或附参考依据额外要求 property.fee_basis.read；初始收款额外要求
      property.bill_receipt.create。自动模式必须核对依据 ID、规则版本和预期金额；预览已变化返回 409。手填金额允许不绑定依据，原因必填。应收可为 0，此时直接结清且不创建收款。可同时登记部分或全额初始已缴，建账、明细、操作和审计原子提交。一房一月只允许一张有效账单，作废后可新建。
    security:
      - AdminSession: []
    parameters:
      - name: community_id
        in: path
        required: true
        schema:
          $ref: ../components/schemas.yaml#/UUIDIdentifier
      - name: Origin
        in: header
        required: false
        schema:
          anyOf:
            - type: string
            - type: 'null'
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          anyOf:
            - type: string
            - type: 'null'
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
    responses:
      '401':
        $ref: ../components/responses.yaml#/AdminProblem
      '403':
        $ref: ../components/responses.yaml#/AdminProblem
      '404':
        $ref: ../components/responses.yaml#/AdminProblem
      '409':
        $ref: ../components/responses.yaml#/AdminProblem
      '422':
        $ref: ../components/responses.yaml#/AdminProblem
      '500':
        $ref: ../components/responses.yaml#/AdminProblem
      '503':
        $ref: ../components/responses.yaml#/AdminProblem
      '201':
        description: 操作成功
        headers:
          X-Request-ID:
            $ref: ../components/headers.yaml#/RequestId
        content:
          application/json:
            schema:
              $ref: ../components/billing-schemas.yaml#/BillWriteResult
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/billing-schemas.yaml#/BillCreate
