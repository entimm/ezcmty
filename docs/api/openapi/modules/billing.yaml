        in: path
        required: true
        schema:
          $ref: ../components/schemas.yaml#/UUIDIdentifier
      - name: Origin
        in: header
        required: false
        schema:
          anyOf:
            - type: string
            - type: 'null'
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          anyOf:
            - type: string
            - type: 'null'
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
