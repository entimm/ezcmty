function beginClaim(houseId){if(!ensureResident())return;if(s.claimUnknown&&s.claimPending){s.claimId=s.claimPending.id;s.claimPending=null;s.claimUnknown=false;s.name='';s.remark='';s.phoneId='';navigate('claim-detail');return;}s.claimStep=1;s.community='';s.trail=[];s.room='';s.claimSelection=null;s.drawer=null;s.name='';s.remark='';s.phoneId=s.phones.length===1?s.phones[0]:'';s.formDirty=false;s.claimPending=null;s.claimUnknown=false;s.claimMode='normal';if(houseId&&s.homes[houseId]){const h=s.homes[houseId];if(active(houseId)){s.bindingId=s.bindings.find(b=>b.houseId===houseId&&b.status==='active').id;navigate('house-detail');return;}const pending=s.claims.find(c=>c.houseId===houseId&&c.status==='pending');if(pending){s.claimId=pending.id;navigate('claim-detail');return;}s.claimSelection=selectionForHouse(houseId);s.community=h.community;const pieces=h.room.split(' · ');s.room=pieces.pop().replace(/\s*室$/,'').trim();s.trail=pieces;if(s.claimSelection){const selected=drawerLocation(s.claimSelection);s.trail=[selected.phase?.name,selected.building?.name,selected.unit?.name].filter(Boolean);s.room=selected.room;}s.claimStep=2;}navigate('claim');if(!houseId)openClaimDrawer();}

function submitClaim(){if(!ensureResident()||blocked())return;if(s.claimUnknown&&s.claimPending){run('正在恢复原申请结果',()=>{s.claimId=s.claimPending.id;s.claimUnknown=false;s.claimPending=null;s.formDirty=false;s.name='';s.remark='';s.phoneId='';s.page='claim-detail';toast('已恢复原申请，等待物业人工审核。');});return;}if(!validateClaim()){render();return;}const target=houseForDraft();if(active(target.id)){toast('此房屋已有有效授权，无需重复申请。');return;}const duplicate=s.claims.find(c=>c.houseId===target.id&&c.status==='pending');if(duplicate){s.claimId=duplicate.id;navigate('claim-detail');toast('已恢复此房屋原有待审申请。');return;}const c={id:'claim-'+s.sequence++,key:'claim-request-'+s.sequence,houseId:target.id,home:structuredClone(target.home),name:s.name.trim(),phone:s.phoneId,remark:s.remark.trim(),status:'pending',created:'2026.10.24 09:41',reviewed:'',scenario:true};s.claimPending=c;const unknown=s.claimMode==='unknown';run('正在提交，避免重复点击',()=>{s.homes[c.houseId]=structuredClone(c.home);if(!s.claims.some(v=>v.id===c.id))s.claims.unshift(c);s.claimId=c.id;s.formDirty=false;if(unknown){s.claimUnknown=true;toast('提交结果未知，请恢复原申请或查看申请记录。');}else{s.claimPending=null;s.name='';s.remark='';s.phoneId='';s.page='claim-detail';s.claimStep=1;toast('申请已提交，等待物业人工审核。');}});}
function updateClaimStatus(c,status){if(!c||!c.scenario||c.status!=='pending'||!['approved','rejected','cancelled'].includes(status))return;if(s.claimPending?.id===c.id){s.claimPending=null;s.claimUnknown=false;}s.bindings=s.bindings.filter(b=>b.claimId!==c.id);c.status=status;c.reviewed=status==='pending'?'':'2026.10.24 10:10';if(status==='approved'){s.bindings.push({id:'binding-'+c.id,houseId:c.houseId,status:'active',claimId:c.id,created:c.reviewed,ended:''});s.house=c.houseId;s.bindingId='binding-'+c.id;}const count=activeIds().length;if(count)s.who=count>1?'multi':'resident';}
function makeOrder(b){const num=s.sequence++,o={id:'payment-'+num,order:'PN20261024'+String(16+num).padStart(4,'0'),houseId:b.houseId,billId:b.id,home:structuredClone(s.homes[b.houseId]),month:b.month,merchant:'锦城安心物业',amount:b.left,status:'ready',created:'2026.10.24 09:41',paid:'',historical:false};s.orders.unshift(o);return o;}
function setPaymentStatus(o,status){if(!o||o.historical)return;const b=s.bills.find(v=>v.id===o.billId);if(o.status==='succeeded'&&status!=='succeeded'&&b){b.settled-=o.amount;b.left+=o.amount;b.entries=b.entries.filter(e=>e.orderId!==o.id);b.version++;o.paid='';}if(status==='succeeded'&&o.status!=='succeeded'&&b){b.settled+=o.amount;b.left=Math.max(0,b.left-o.amount);b.entries.push({type:'本人缴纳',amount:o.amount,date:'2026.10.24',orderId:o.id});b.version++;o.paid='2026.10.24 09:42';}o.status=status;}
function phoneNumber(){const n=s.phoneDraft.trim().replace(/\s|-/g,'').replace(/^(\+86|0086)/,'');if(n&&!/^1[3-9]\d{9}$/.test(n)){s.error='请输入有效的大陆手机号，或清空后选择微信号码。';render();return null;}return n||'13902806028';}
root.addEventListener('input',e=>{const f=e.target.dataset.field;if(!f||s.busy||s.claimUnknown)return;if(f==='drawerSearch'&&s.drawer){s.drawer.query=e.target.value;const results=$('xp-drawer-results');if(results)results.innerHTML=drawerResults(s.drawer);if(globalThis.lucide)lucide.createIcons();return;}if(f==='roomSearch'){$('xp-room-results').innerHTML=roomResults(e.target.value);if(globalThis.lucide)lucide.createIcons();return;}if(!['name','remark','search','phoneDraft'].includes(f)||f==='phoneDraft'&&s.phonePending)return;s[f]=e.target.value;if(['name','remark'].includes(f))s.formDirty=true;if(f==='search'){$('xp-search-results').innerHTML=communityResults();if(globalThis.lucide)lucide.createIcons();}});

function action(a){
 const [cmd,...parts]=a.split(':'),arg=parts.join(':');
 if(cmd==='tab'){if(!['home','bills','houses','profile'].includes(arg)||staff()||s.modal||s.drawer||s.busy)return;if(s.page===arg&&s.view==='normal')return;s.history=[];navigate(arg,true);return;}

 if(cmd==='claim-add-phone'){s.phoneReturn=true;navigate('phones');s.modal='phone';render();return;}if(cmd==='return-claim'){s.phoneReturn=false;navigate('claim');s.claimStep=2;render();return;}if(cmd==='add-phone'){s.modal='phone';s.error='';render();return;}
 if(cmd==='phone-cancel'){toast('已取消微信授权，填写内容已保留。');return;}if(cmd==='phone-mismatch'){s.error='填写号码与微信授权号码不一致，请重新选择。';render();return;}if(cmd==='phone-unknown'){const n=phoneNumber();if(!n)return;s.phonePending={phone:n,key:'phone-request-'+s.sequence++};s.error='';render();toast('验证结果尚未确认，请使用原操作重试。');return;}
 if(cmd==='phone-authorize'){const n=s.phonePending?.phone||phoneNumber();if(!n)return;run('正在验证手机号',()=>{if(!s.phones.includes(n))s.phones.push(n);s.modal='';s.error='';s.phoneDraft='';s.phonePending=null;if(s.phones.length===1)s.phoneId=n;toast('手机号验证成功');});return;}
 if(cmd==='unbind'){if(!s.phones.includes(arg))return;s.modal='unbind:'+arg;render();return;}if(cmd==='confirm-unbind'){const p=s.modal.slice(7);if(!s.phones.includes(p))return;s.phones=s.phones.filter(n=>n!==p);if(!s.phoneHistory.includes(p))s.phoneHistory.push(p);if(s.phoneId===p)s.phoneId='';s.modal='';render();toast('已解绑，现有申请及房屋授权不受影响。');return;}
 if(cmd==='location-next'){if(s.claimSelection&&drawerHouseId(s.claimSelection)){s.claimStep=2;render();}else openClaimDrawer();return;}if(cmd==='claim-next'){if(!validateClaim()){render();return;}s.error='';s.claimStep=3;render();return;}if(cmd==='claim-back'){s.claimStep=Math.max(1,s.claimStep-1);s.error='';render();return;}if(cmd==='claim-mode'){s.claimMode=arg;render();return;}if(cmd==='claim-submit'){submitClaim();return;}
 if(cmd==='withdraw'){if(claimRecord()?.status!=='pending')return;s.modal='withdraw';render();return;}if(cmd==='release'){if(binding()?.status!=='active')return;s.modal='release';render();return;}if(cmd==='logout'){s.modal='logout';render();return;}

 if(cmd==='availability'){const b=bill();if(!b||!active(b.houseId)||!b.left)return;if(arg!=='own'&&ownOrder(b)){toast('请先核实或关闭本人原单，不能覆盖在途支付状态。');return;}if(arg==='own'){let o=ownOrder(b);if(!o)o=makeOrder(b);s.orderId=o.id;b.availability='available';}else if(arg==='changed'){b.total+=20;b.left+=20;b.version++;b.availability='changed';}else b.availability=arg;render();return;}if(cmd==='refresh-bill'){if(!bill()||!active(bill().houseId))return;bill().availability='available';render();toast('已读取最新余额，请重新核对。');return;}
