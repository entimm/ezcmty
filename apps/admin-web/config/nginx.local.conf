    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $xlife_connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_buffering off;

    location = /api/property {
        proxy_pass http://127.0.0.1:5173;
    }
    location ^~ /api/property/ {
        proxy_pass http://127.0.0.1:5173;
    }
    location ~* ^/(platform|api)(/|$) {
        return 404;
    }

    location = /property {
        return 308 /$is_args$args;
    }
    location ~ ^/property(/.*)$ {
        return 308 $1$is_args$args;
