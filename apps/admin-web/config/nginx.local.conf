# 本地管理后台域名站点；API 转发沿用 Umi 的开发代理。
map $http_upgrade $xlife_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name platform.xlife.test;
    absolute_redirect off;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $xlife_connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_buffering off;

    location = /api/platform {
        proxy_pass http://127.0.0.1:5173;
    }
    location ^~ /api/platform/ {
        proxy_pass http://127.0.0.1:5173;
    }
    location ~* ^/(property|api)(/|$) {
        return 404;
    }

    location = /platform {
        return 308 /$is_args$args;
    }
    location ~ ^/platform/property/(companies|communities)(/.*)?$ {
        return 308 /$1$2$is_args$args;
    }
    location ~ ^/platform(/.*)$ {
        return 308 $1$is_args$args;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
    }
}

server {
    listen 8080;
    server_name property.xlife.test;
    absolute_redirect off;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
